# Mumble test server inside the relay jail. Everything is guarded: only the jail's own address is
# used, because a shared-IP jail on FreeBSD has no IPv6 and murmur fails to bind its default
# dual-stack listener ("Protocol type not supported").
database=/var/db/mumble-server/mumble-server.sqlite
logfile=/var/log/mumble-server/mumble-server.log
pidfile=/var/run/mumble-server/mumble-server.pid
welcometext="<br />Mumcord relay test server<br />"
port=64738
host=@JAIL_IP@
serverpassword=
bandwidth=558000
users=100
messageburst=5
messagelimit=1
allowping=true
certrequired=false
