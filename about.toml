# cargo-about configuration: generates the Rust part of THIRD_PARTY_NOTICES.
# AGPL-3.0 is Mumcord itself (workspace crates); every other entry is a permissive license compatible with it.
# Run via scripts/generate-notices.sh.
accepted = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
# Include dependencies for all supported desktop platforms, not only the host.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]
