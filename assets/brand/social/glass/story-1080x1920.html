<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – glass – story 1080×1920</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1920px; }
  /* Text stays clear of the top 250 px and the bottom 340 px, where the Stories and Reels UI sits. */
  :root { --lock: 48px; --h1: 136px; --p: 40px; --small: 28px; --label: 28px; }
  .copy { left: 90px; top: 280px; width: 900px; }
  .rig { transform: rotateY(-12deg) rotateX(10deg); transform-origin: 540px 1300px; }
  .c-share { left: 250px; top: 1050px; width: 780px; transform: translateZ(0px) rotate(0deg); }
  .c-chat { left: 40px; top: 1280px; width: 500px; transform: translateZ(70px) rotate(-3deg); }
  .c-cam { left: 640px; top: 1380px; width: 400px; transform: translateZ(40px) rotate(4deg); }
  .o1 { left: 720px; top: 1080px; width: 520px; height: 520px; }
  .o2 { left: 820px; top: 1600px; width: 320px; height: 320px; }
  .o3 { left: -70px; top: 1640px; width: 200px; height: 200px; }

</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="scene"><div class="rig">
    <div class="glass c-share"><img src="../shared/crop-share.png" alt=""><span class="label">Screen sharing</span></div>
    <div class="glass c-cam"><div class="cams"><div class="cam talking"><img src="cameras/maya.jpg" alt=""></div><div class="cam"><img src="cameras/jonas.jpg" alt=""></div><div class="cam"><img src="cameras/mei.jpg" alt=""></div><div class="cam"><img src="cameras/leo.jpg" alt=""></div></div><span class="label">Cameras</span></div>
    <div class="glass c-chat"><img src="../shared/crop-chat.png" alt=""><span class="label">Chat with images</span></div>
  </div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display">Crystal-clear voice for your community.</h1>
    <p><b>Talk, text, share your screen and turn on cameras.</b> Plugins included.</p>
    <div class="small">Built on the open Mumble protocol</div>
  </div>
</body>
</html>
