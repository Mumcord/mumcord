<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – glass – linkedin-banner 1584×396</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1584px; --h: 396px; }
  /* Text sits right of 560 px and above the bottom 60 px; the profile photo covers the lower left. */
  :root { --lock: 26px; --h1: 50px; --p: 20px; --small: 15px; --label: 14px; }
  .copy { left: 600px; top: 36px; width: 540px; }
  .rig { transform: rotateY(-16deg) rotateX(8deg); transform-origin: 1350px 200px; }
  .c-share { left: 1180px; top: 34px; width: 330px; transform: translateZ(0px) rotate(0deg); }
  .c-chat { left: 1150px; top: 190px; width: 210px; transform: translateZ(60px) rotate(-3deg); }
  .c-cam { left: 1390px; top: 200px; width: 170px; transform: translateZ(30px) rotate(4deg); }
  .o1 { left: 1060px; top: -160px; width: 320px; height: 320px; }
  .o2 { left: 1440px; top: 260px; width: 200px; height: 200px; }
  .o3 { left: 380px; top: 260px; width: 120px; height: 120px; }
  p { display: none; }
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="scene"><div class="rig">
    <div class="glass c-share"><img src="../shared/crop-share.png" alt=""><span class="label">Screen sharing</span></div>
    <div class="glass c-cam"><div class="cams"><div class="cam talking"><img src="cameras/maya.jpg" alt=""></div><div class="cam"><img src="cameras/jonas.jpg" alt=""></div><div class="cam"><img src="cameras/mei.jpg" alt=""></div><div class="cam"><img src="cameras/leo.jpg" alt=""></div></div><span class="label">Cameras</span></div>
    <div class="glass c-chat"><img src="../shared/crop-chat.png" alt=""><span class="label">Chat with images</span></div>
  </div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display">Crystal-clear voice for your community.</h1>
    <p><b>Talk, text, share your screen and turn on cameras.</b> Plugins included.</p>
    <div class="small">Built on the open Mumble protocol</div>
  </div>
</body>
</html>
