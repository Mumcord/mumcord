<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – glass – instagram-square 1080×1080</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1080px; }
  /* Text stays in the centre 810 px: the Instagram profile grid crops square posts to 3:4. */
  :root { --lock: 40px; --h1: 92px; --p: 30px; --small: 22px; --label: 22px; }
  .copy { left: 135px; top: 64px; width: 810px; }
  .rig { transform: rotateY(-12deg) rotateX(10deg); transform-origin: 540px 800px; }
  .c-share { left: 330px; top: 600px; width: 540px; transform: translateZ(0px) rotate(0deg); }
  .c-chat { left: 60px; top: 730px; width: 340px; transform: translateZ(70px) rotate(-3deg); }
  .c-cam { left: 740px; top: 770px; width: 290px; transform: translateZ(40px) rotate(4deg); }
  .o1 { left: 700px; top: 560px; width: 480px; height: 480px; }
  .o2 { left: 860px; top: 920px; width: 260px; height: 260px; }
  .o3 { left: -40px; top: 560px; width: 140px; height: 140px; }

</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="scene"><div class="rig">
    <div class="glass c-share"><img src="../shared/crop-share.png" alt=""><span class="label">Screen sharing</span></div>
    <div class="glass c-cam"><div class="cams"><div class="cam talking"><img src="cameras/maya.jpg" alt=""></div><div class="cam"><img src="cameras/jonas.jpg" alt=""></div><div class="cam"><img src="cameras/mei.jpg" alt=""></div><div class="cam"><img src="cameras/leo.jpg" alt=""></div></div><span class="label">Cameras</span></div>
    <div class="glass c-chat"><img src="../shared/crop-chat.png" alt=""><span class="label">Chat with images</span></div>
  </div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display">Crystal-clear voice for your community.</h1>
    <p><b>Talk, text, share your screen and turn on cameras.</b> Plugins included.</p>
    <div class="small">Built on the open Mumble protocol</div>
  </div>
</body>
</html>
