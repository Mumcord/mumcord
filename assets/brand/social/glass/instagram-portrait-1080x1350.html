<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – glass – instagram-portrait 1080×1350</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1350px; }
  /* Text stays inside the centre 1012 px plus a 60 px margin (profile grid crops to 3:4). */
  :root { --lock: 44px; --h1: 104px; --p: 34px; --small: 24px; --label: 24px; }
  .copy { left: 100px; top: 80px; width: 880px; }
  .rig { transform: rotateY(-12deg) rotateX(10deg); transform-origin: 540px 1000px; }
  .c-share { left: 330px; top: 760px; width: 600px; transform: translateZ(0px) rotate(0deg); }
  .c-chat { left: 70px; top: 900px; width: 380px; transform: translateZ(70px) rotate(-3deg); }
  .c-cam { left: 730px; top: 960px; width: 320px; transform: translateZ(40px) rotate(4deg); }
  .o1 { left: 680px; top: 640px; width: 520px; height: 520px; }
  .o2 { left: 840px; top: 1180px; width: 300px; height: 300px; }
  .o3 { left: -50px; top: 700px; width: 160px; height: 160px; }

</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="scene"><div class="rig">
    <div class="glass c-share"><img src="../shared/crop-share.png" alt=""><span class="label">Screen sharing</span></div>
    <div class="glass c-cam"><div class="cams"><div class="cam talking"><img src="cameras/maya.jpg" alt=""></div><div class="cam"><img src="cameras/jonas.jpg" alt=""></div><div class="cam"><img src="cameras/mei.jpg" alt=""></div><div class="cam"><img src="cameras/leo.jpg" alt=""></div></div><span class="label">Cameras</span></div>
    <div class="glass c-chat"><img src="../shared/crop-chat.png" alt=""><span class="label">Chat with images</span></div>
  </div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display">Crystal-clear voice for your community.</h1>
    <p><b>Talk, text, share your screen and turn on cameras.</b> Plugins included.</p>
    <div class="small">Built on the open Mumble protocol</div>
  </div>
</body>
</html>
