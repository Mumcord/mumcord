<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – Instagram square 1080×1080</title>
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1080px; --h: 1080px; }
  /* Text stays in the centre 810 px: the Instagram profile grid crops square posts to 3:4. */
  .brand { left: 135px; right: 135px; top: 64px; align-items: center; text-align: center; gap: 26px; }
  .lockup { gap: 26px; }
  .logo { width: 130px; height: 130px; }
  .name { font-size: 124px; }
  .bar { width: 200px; height: 10px; }
  .tagline { font-size: 52px; }
  .chips { font-size: 30px; justify-content: center; max-width: 480px; }
  /* Bleeds off the right and bottom edge on purpose. */
  .shot { left: 80px; top: 640px; width: 1180px; height: 520px; border-radius: 30px; }
  .shot img { width: 1180px; height: auto; }
</style>
</head>
<body>
  <div class="brand">
    <div class="lockup">
      <img class="logo" src="../mumcord-icon.svg" alt="">
      <h1 class="name">Mumcord</h1>
    </div>
    <div class="bar"></div>
    <p class="tagline">Modern voice chat<br>for any Mumble server</p>
    <ul class="chips"><li>Text chat</li><li>Screen sharing</li><li>Cameras</li><li>Plugins</li></ul>
  </div>
  <div class="shot"><img src="../../../docs/images/screenshots/main-dark.png" alt=""></div>
</body>
</html>
