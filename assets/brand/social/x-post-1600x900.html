<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – X post 1600×900</title>
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1600px; --h: 900px; }
  .brand { left: 96px; top: 0; bottom: 0; width: 700px; justify-content: center; gap: 34px; }
  .lockup { gap: 30px; }
  .logo { width: 150px; height: 150px; }
  .name { font-size: 128px; }
  .bar { width: 200px; height: 10px; }
  .tagline { font-size: 54px; }
  .chips { font-size: 32px; }
  .shot { left: 900px; top: 130px; width: 1000px; height: 640px; border-radius: 30px; }
</style>
</head>
<body>
  <div class="brand">
    <div class="lockup">
      <img class="logo" src="../mumcord-icon.svg" alt="">
      <h1 class="name">Mumcord</h1>
    </div>
    <div class="bar"></div>
    <p class="tagline">Modern voice chat for any Mumble server</p>
    <ul class="chips"><li>Text chat</li><li>Screen sharing</li><li>Cameras</li><li>Plugins</li></ul>
  </div>
  <div class="shot"><img src="../../../docs/images/screenshots/main-dark.png" alt=""></div>

</html>
