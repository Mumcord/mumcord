<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – neon – story 1080×1920</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1920px; }
  /* Text stays clear of the top 250 px and the bottom 340 px, where the Stories and Reels UI sits. */
  :root { --lock: 48px; --tag: 26px; --h1: 150px; --p: 42px; --small: 28px; --floor: 700px; }
  .copy { left: 90px; top: 280px; width: 900px; }
  .stage { left: 170px; top: 1060px; width: 1200px; }
  .shot { transform: rotateY(-22deg) rotateX(14deg) rotateZ(-4deg); }

</style>
</head>
<body>
  <div class="floor"><i></i></div>
  <div class="stage"><div class="shot"><img src="../../../../docs/images/screenshots/main-dark.png" alt=""></div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <div class="tag">Voice chat for your crew</div>
    <h1 class="display">Talk. Share.<br><span class="neon">Play together.</span></h1>
    <p>Crystal-clear voice, text chat, screen sharing and cameras.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
  <div class="scan"></div>
</body>
</html>
