<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – neon – instagram-square 1080×1080</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1080px; }
  /* Text stays in the centre 810 px: the Instagram profile grid crops square posts to 3:4. */
  :root { --lock: 40px; --tag: 22px; --h1: 118px; --p: 32px; --small: 24px; --floor: 420px; }
  .copy { left: 135px; top: 64px; width: 810px; }
  .stage { left: 250px; top: 720px; width: 1000px; }
  .shot { transform: rotateY(-22deg) rotateX(14deg) rotateZ(-4deg); }

</style>
</head>
<body>
  <div class="floor"><i></i></div>
  <div class="stage"><div class="shot"><img src="../../../../docs/images/screenshots/main-dark.png" alt=""></div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <div class="tag">Voice chat for your crew</div>
    <h1 class="display">Talk. Share.<br><span class="neon">Play together.</span></h1>
    <p>Crystal-clear voice, text chat, screen sharing and cameras.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
  <div class="scan"></div>
</body>
</html>
