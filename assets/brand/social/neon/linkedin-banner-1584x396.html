<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – neon – linkedin-banner 1584×396</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1584px; --h: 396px; }
  /* Text sits right of 560 px and above the bottom 60 px; the profile photo covers the lower left. */

  .copy { left: 600px; top: 40px; width: 560px; }
  .stage { left: 1150px; top: 36px; width: 640px; }

  .tag, p { display: none; }
  h1 { margin-top: 0.3em; }
</style>
</head>
<body>
  <div class="floor"><i></i></div>
  <div class="stage"><div class="shot"><img src="../../../../docs/images/screenshots/main-dark.png" alt=""></div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <div class="tag">Voice chat for your crew</div>
    <h1 class="display">Talk. Share.<br><span class="neon">Play together.</span></h1>
    <p>Crystal-clear voice, text chat, screen sharing and cameras.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
  <div class="scan"></div>
</body>
</html>
