<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – neon – og 1200×630</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1200px; --h: 630px; }
  /* 60 px margin on every side; text on the left, the picture is decorative. */
  :root { --lock: 34px; --tag: 19px; --h1: 92px; --p: 27px; --small: 20px; --floor: 330px; }
  .copy { left: 60px; top: 50px; width: 600px; }
  .stage { left: 650px; top: 52px; width: 900px; }
  .shot { transform: rotateY(-26deg) rotateX(10deg) rotateZ(-4deg); }
  p { width: 540px; }
</style>
</head>
<body>
  <div class="floor"><i></i></div>
  <div class="stage"><div class="shot"><img src="../../../../docs/images/screenshots/main-dark.png" alt=""></div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <div class="tag">Voice chat for your crew</div>
    <h1 class="display">Talk. Share.<br><span class="neon">Play together.</span></h1>
    <p>Crystal-clear voice, text chat, screen sharing and cameras.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
  <div class="scan"></div>
</body>
</html>
