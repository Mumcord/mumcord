<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – neon – instagram-portrait 1080×1350</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1350px; }
  /* Text stays inside the centre 1012 px plus a 60 px margin (profile grid crops to 3:4). */
  :root { --lock: 44px; --tag: 24px; --h1: 128px; --p: 36px; --small: 26px; --floor: 480px; }
  .copy { left: 100px; top: 90px; width: 880px; }
  .stage { left: 220px; top: 880px; width: 1100px; }
  .shot { transform: rotateY(-22deg) rotateX(14deg) rotateZ(-4deg); }

</style>
</head>
<body>
  <div class="floor"><i></i></div>
  <div class="stage"><div class="shot"><img src="../../../../docs/images/screenshots/main-dark.png" alt=""></div></div>
  <div class="copy">
    <div class="lockup"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <div class="tag">Voice chat for your crew</div>
    <h1 class="display">Talk. Share.<br><span class="neon">Play together.</span></h1>
    <p>Crystal-clear voice, text chat, screen sharing and cameras.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
  <div class="scan"></div>
</body>
</html>
