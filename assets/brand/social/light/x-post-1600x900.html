<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – light – x-post 1600×900</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1600px; --h: 900px; }
  /* Shown in full at 16:9; 60 px margin. */
  :root { --eye: 24px; --h1: 100px; --p: 30px; --small: 24px; }
  .copy { left: 90px; top: 110px; width: 700px; }
  .shot { left: 860px; top: 130px; width: 1000px; }
  .wash { left: 760px; top: 80px; width: 1000px; height: 800px; }

</style>
</head>
<body>
  <div class="wash"></div>
  <div class="shot"><img src="../../../../docs/images/screenshots/main-light.png" alt=""></div>
  <div class="copy">
    <div class="eyebrow"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display"><span>Voice chat<br>for your crew.</span><span class="soft">Crystal clear.</span></h1>
    <div class="rule"></div>
    <p><b>Talk, chat, share your screen</b> with friends, gaming groups and communities.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
</body>
</html>
