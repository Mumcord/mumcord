<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – light – story 1080×1920</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1920px; }
  /* Text stays clear of the top 250 px and the bottom 340 px, where the Stories and Reels UI sits. */
  :root { --eye: 30px; --h1: 124px; --p: 40px; --small: 28px; }
  .copy { left: 90px; top: 290px; width: 900px; }
  .shot { left: 90px; top: 1040px; width: 1400px; }
  .wash { left: 0px; top: 960px; width: 1200px; height: 900px; }

</style>
</head>
<body>
  <div class="wash"></div>
  <div class="shot"><img src="../../../../docs/images/screenshots/main-light.png" alt=""></div>
  <div class="copy center">
    <div class="eyebrow"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display"><span>Voice chat<br>for your crew.</span><span class="soft">Crystal clear.</span></h1>
    <div class="rule"></div>
    <p><b>Talk, chat, share your screen</b> with friends,<br>gaming groups and communities.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
</body>
</html>
