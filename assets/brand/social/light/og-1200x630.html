<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – light – og 1200×630</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1200px; --h: 630px; }
  /* 60 px margin on every side; text on the left, the picture is decorative. */
  :root { --eye: 20px; --h1: 76px; --p: 24px; --small: 20px; }
  .copy { left: 76px; top: 70px; width: 520px; }
  .shot { left: 640px; top: 96px; width: 760px; }
  .wash { left: 540px; top: 60px; width: 820px; height: 640px; }

</style>
</head>
<body>
  <div class="wash"></div>
  <div class="shot"><img src="../../../../docs/images/screenshots/main-light.png" alt=""></div>
  <div class="copy">
    <div class="eyebrow"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display"><span>Voice chat<br>for your crew.</span><span class="soft">Crystal clear.</span></h1>
    <div class="rule"></div>
    <p><b>Talk, chat, share your screen</b> with friends, gaming groups and communities.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
</body>
</html>
