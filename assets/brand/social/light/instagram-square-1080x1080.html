<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumcord share image – light – instagram-square 1080×1080</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --w: 1080px; --h: 1080px; }
  /* Text stays in the centre 810 px: the Instagram profile grid crops square posts to 3:4. */
  :root { --eye: 24px; --h1: 96px; --p: 30px; --small: 22px; }
  .copy { left: 135px; top: 72px; width: 810px; }
  .shot { left: 120px; top: 660px; width: 960px; }
  .wash { left: 60px; top: 560px; width: 1000px; height: 700px; }

</style>
</head>
<body>
  <div class="wash"></div>
  <div class="shot"><img src="../../../../docs/images/screenshots/main-light.png" alt=""></div>
  <div class="copy center">
    <div class="eyebrow"><img src="../../mumcord-icon.svg" alt="">Mumcord</div>
    <h1 class="display"><span>Voice chat<br>for your crew.</span><span class="soft">Crystal clear.</span></h1>
    <div class="rule"></div>
    <p><b>Talk, chat, share your screen</b> with friends,<br>gaming groups and communities.</p>
    <div class="small">Works with any Mumble server</div>
  </div>
</body>
</html>
