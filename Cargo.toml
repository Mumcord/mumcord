[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/audio",
    "crates/store",
    "crates/engine",
    "crates/bot",
    "crates/positional",
    "crates/overlay-ipc",
    "crates/overlay-layer",
    "crates/p2p",
    "crates/screenshare",
    "tools/netsim",
    "src-tauri",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/ToBee94/mumcord"

[workspace.dependencies]
# Internal crates
mumcord-protocol = { path = "crates/protocol" }
mumcord-audio = { path = "crates/audio" }
mumcord-store = { path = "crates/store" }
mumcord-engine = { path = "crates/engine" }
mumcord-positional = { path = "crates/positional" }
mumcord-overlay-ipc = { path = "crates/overlay-ipc" }
mumcord-p2p = { path = "crates/p2p" }
mumcord-screenshare = { path = "crates/screenshare" }

# Async, networking, TLS
tokio = { version = "1.54", features = ["full"] }
# ring instead of the default aws-lc-rs: no cmake/NASM needed on Windows and macOS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
bytes = "1"
# Link previews (FR-1.49): HTTP/1.1 client on the same rustls/ring stack as the Mumble
# connection, with the OS certificate store for web sites.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls-platform-verifier = "0.6"

# Direct Mumcord-to-Mumcord connections (FR-2.35): QUIC on the same rustls/ring stack, router
# port mapping over UPnP (igd-next) and NAT-PMP/PCP (crab_nat), default gateway and interface
# addresses (netdev).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
crab_nat = "0.8"
netdev = { version = "0.47", default-features = false, features = ["gateway"] }
# Dual-stack UDP socket (IPv6 with IPv4 mapped) on every platform; already in the tree via tokio.
socket2 = "0.6"

# Protobuf
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.3"

# Crypto & certificates
aes = "0.8"
rand = "0.10"
sha1 = "0.10"
# Content hash of full-size images shared between Mumcord clients (FR-1.60c).
sha2 = "0.10"
rcgen = "0.14"
p12-keystore = "0.4"
# Only used to generate RSA identity keys (ring cannot generate RSA keys); signing stays with ring.
rsa = { version = "0.9", default-features = false, features = ["std", "getrandom", "u64_digit"] }

# Audio
cpal = "0.18"
# opusic-sys builds libopus statically from bundled sources.
opus = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
sonora = "0.2"
rtrb = "0.3"
rubato = "0.16"
hound = "3.5"

# Screen sharing (FR-2.42): VP9 software codec on the system or a CI-built static libvpx, found
# with pkg-config; bindings are generated at build time so they always match the linked version.
bindgen = "0.72"
pkg-config = "0.3"
# Wayland screen capture (FR-2.42): the ScreenCast portal hands over a PipeWire stream; the
# system libpipewire is linked (present on every Wayland desktop).
pipewire = "0.10"
# macOS screen capture (FR-2.42): ScreenCaptureKit's picker, stream and per-app sound, through
# the objc2 framework bindings Tauri already pulls in (MIT/Apache-2.0/Zlib).
objc2 = "0.6"
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std"] }

# Storage & secrets
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"

# Sanitizing, own avatar scaling
ammonia = "4.2"
# Tokenizer for page metadata; the same version ammonia already uses.
html5ever = "0.40"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# In-game overlay (FR-1.46b): glyph rasterizing in the game-side renderer, Vulkan bindings for
# the Linux layer (no loader linking: the layer gets every function from the next layer).
ab_glyph = "0.2"
ash = { version = "0.38", default-features = false, features = ["std"] }

# Positional audio / plugin host
libloading = "0.8"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp"] }

# Linux desktop portals (Wayland global shortcuts)
ashpd = "0.13"
# XDG activation token so the desktop may raise the window a portal call opens (already in the tree via Tauri)
gdk = "0.18"
# Desktop notifications for new messages (FR-1.48c): the freedesktop notification service on D-Bus,
# talked to directly for click actions and per-channel replacement (zbus and futures-util are
# already in the tree via ashpd; gtk via Tauri, used to hand the activation token to the window).
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
# Desktop launchers for links, run with the host environment inside an AppImage (issue #9).
open = "5.4"
gtk = "0.18"
# Desktop notifications on Windows and macOS (show only; no click callback there).
notify-rust = { version = "4.18", default-features = false }

# Mouse-button push-to-talk: X11 XInput2 raw events, macOS event tap (already in the tree)
x11rb = { version = "0.13", default-features = false }
core-graphics = "0.25"
core-foundation = "0.10"

# Errors, logging, serialization, CLI
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# Tauri
tauri-build = { version = "2.7", features = [] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Backtraces keep file and line numbers; full debug info would make target dirs much larger and
# links slower.
[profile.dev]
debug = "line-tables-only"

# RSA-2048 key generation in the first-start wizard takes seconds to minutes in unoptimised
# debug builds; optimising just these crates keeps dev and E2E builds responsive.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
