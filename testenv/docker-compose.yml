# Local Mumble test servers. Start with ./up.sh, never with plain "docker compose up"
# (up.sh generates certificates, exports PUID/PGID and seeds channels).
x-mumble: &mumble
  restart: "no"
  environment: &mumble-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    MUMBLE_SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?copy .env.example to .env}
    MUMBLE_ACCEPT_UNKNOWN_SETTINGS: "true"
    MUMBLE_CONFIG_SERVERPASSWORD: ${SERVER_PASSWORD:-}
    MUMBLE_CONFIG_SSLCERT: /certs/cert.pem
    MUMBLE_CONFIG_SSLKEY: /certs/key.pem
    MUMBLE_CONFIG_REGISTERNAME: Mumcord Test Server
    MUMBLE_CONFIG_BANDWIDTH: "72000"
    MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"   # tests reconnect often; never ban them

services:
  v15:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.5.735
    ports: ["64738:64738/tcp", "64738:64738/udp"]
    volumes: ["./data/v15:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  v14:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.4.230
    # This image has no PUID/PGID support and runs as a fixed uid 1000, which cannot write to a
    # data dir owned by another host user (e.g. uid 1001 on CI runners).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports: ["64739:64738/tcp", "64739:64738/udp"]
    volumes: ["./data/v14:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  # Listener limits of 0 disable channel listening, so Listen must be refused.
  limit:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.5.735
    environment:
      <<: *mumble-env
      MUMBLE_CONFIG_LISTENERSPERCHANNEL: "0"
      MUMBLE_CONFIG_LISTENERSPERUSER: "0"
    ports: ["64741:64738/tcp", "64741:64738/udp"]
    volumes: ["./data/limit:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  v13:
    build: ./v13
    image: mumcord-testenv-v13
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?copy .env.example to .env}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
    ports: ["64740:64738/tcp", "64740:64738/udp"]
    volumes: ["./data/v13:/data", "./certs/${CERT_SET:-A}:/certs:ro"]
