# Local Mumble test servers. Start with ./up.sh, never with plain "docker compose up"
# (up.sh generates certificates, exports PUID/PGID and seeds channels).
x-mumble: &mumble
  restart: "no"
  environment: &mumble-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    MUMBLE_SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?copy .env.example to .env}
    MUMBLE_ACCEPT_UNKNOWN_SETTINGS: "true"
    MUMBLE_CONFIG_SERVERPASSWORD: ${SERVER_PASSWORD:-}
    MUMBLE_CONFIG_SSLCERT: /certs/cert.pem
    MUMBLE_CONFIG_SSLKEY: /certs/key.pem
    MUMBLE_CONFIG_REGISTERNAME: Mumcord Test Server
    MUMBLE_CONFIG_BANDWIDTH: "72000"
    MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"   # tests reconnect often; never ban them

services:
  v15:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.5.735
    ports: ["${PORT_V15:-64738}:64738/tcp", "${PORT_V15:-64738}:64738/udp"]
    volumes: ["./${DATA_ROOT:-data}/v15:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  # Second 1.5 server for multi-server tests (a different server to connect to at the same time).
  v15b:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.5.735
    environment:
      <<: *mumble-env
      MUMBLE_CONFIG_REGISTERNAME: Mumcord Test Server B
    ports: ["${PORT_V15B:-64742}:64738/tcp", "${PORT_V15B:-64742}:64738/udp"]
    volumes: ["./${DATA_ROOT:-data}/v15b:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  v14:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.4.230
    # This image has no PUID/PGID support and runs as a fixed uid 1000, which cannot write to a
    # data dir owned by another host user (e.g. uid 1001 on CI runners).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      <<: *mumble-env
      # Tests of the bitrate slider raise this above the 96 kbit/s speech cap (local server only).
      MUMBLE_CONFIG_BANDWIDTH: "${BANDWIDTH_V14:-72000}"
    ports: ["${PORT_V14:-64739}:64738/tcp", "${PORT_V14:-64739}:64738/udp"]
    volumes: ["./${DATA_ROOT:-data}/v14:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  # Listener limits of 0 disable channel listening, so Listen must be refused.
  limit:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.5.735
    environment:
      <<: *mumble-env
      MUMBLE_CONFIG_LISTENERSPERCHANNEL: "0"
      MUMBLE_CONFIG_LISTENERSPERUSER: "0"
    ports: ["${PORT_LIMIT:-64741}:64738/tcp", "${PORT_LIMIT:-64741}:64738/udp"]
    volumes: ["./${DATA_ROOT:-data}/limit:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  v13:
    build: ./v13
    image: mumcord-testenv-v13
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?copy .env.example to .env}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
    ports: ["${PORT_V13:-64740}:64738/tcp", "${PORT_V13:-64740}:64738/udp"]
    volumes: ["./${DATA_ROOT:-data}/v13:/data", "./certs/${CERT_SET:-A}:/certs:ro"]

  # Local mumbot (music + plugins modules) on v15 for the plugin tests. Only started by
  # mumbot/up.sh (profile "mumbot"); a plain ./up.sh never starts it.
  mumbot:
    profiles: ["mumbot"]
    image: ghcr.io/mumcord/mumbot:0.4.1
    command: ["run"]
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MUMBOT_CONFIG: /config/bot.toml
      MUMBOT_DATA: /data
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
    ports:
      # Loopback only: the API key travels in clear text over plain HTTP.
      - "127.0.0.1:${MUMBOT_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./${DATA_ROOT:-data}/mumbot/bot.toml:/config/bot.toml:ro"
      - "./${DATA_ROOT:-data}/mumbot/data:/data"
      - "./mumbot/media:/media:ro"
    # The image's own health check asks the webhook port, which does not run here.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health | grep -q '\"connected\":true'"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
