[package]
name = "mumcord-engine"
description = "App state, sessions, chat and diagnostics; the only layer the UI talks to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mumcord-protocol.workspace = true
mumcord-audio.workspace = true
mumcord-store.workspace = true
mumcord-positional.workspace = true
mumcord-p2p.workspace = true
mumcord-screenshare.workspace = true
tokio.workspace = true
# Import from the official Mumble client (issue #66): its database and 1.4/1.5 settings.
rusqlite.workspace = true
base64.workspace = true
plist.workspace = true
x509-parser.workspace = true
bytes.workspace = true
ammonia.workspace = true
html5ever.workspace = true
regex.workspace = true
reqwest.workspace = true
quick-xml.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
sha1.workspace = true
sha2.workspace = true
image.workspace = true
# rnnoise-rs is a git source (Mumcord's fork); see the workspace Cargo.toml. A published
# crate cannot carry it, so the backend implementation lives here (issue #176).
rnnoise-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Core protocol only: whole-screen capture on X11 (GetImage on the root window).
x11rb.workspace = true
# Wayland capture: the ScreenCast portal picks the window or screen, PipeWire delivers the frames.
ashpd = { workspace = true, features = ["screencast"] }
pipewire.workspace = true
futures-util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Screen capture with the shared app's sound: ScreenCaptureKit (macOS 12.3+, sound 13+, system
# picker 14+).
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSEnumerator", "NSError", "NSProcessInfo", "NSString", "NSValue"] }
objc2-screen-capture-kit = { workspace = true, features = ["SCContentSharingPicker", "SCError", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { workspace = true, features = ["CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-graphics = { workspace = true, features = ["CGDirectDisplay", "CGWindow"] }
objc2-core-audio-types = { workspace = true, features = ["CoreAudioBaseTypes"] }

[target.'cfg(windows)'.dependencies]
# Mumble 1.4 keeps its settings in the registry (issue #66).
windows-registry.workspace = true
# Screen capture: the system picker and frames of Windows.Graphics.Capture (Direct3D 11), and the
# shared app's sound via WASAPI process loopback. Same version as Tauri's own `windows`;
# `windows-core` for the activation callback (`#[implement]`).
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-future = "0.3"

[features]
# Env-selected file/null audio backend for headless tests and E2E; never in release builds.
test-backend = ["mumcord-audio/test-backend"]

[dev-dependencies]
tempfile.workspace = true
# Paused time for the relay timeouts.
tokio = { workspace = true, features = ["test-util"] }
# Live tests drive scripted bots through the mumbot library.
mumbot = { git = "https://github.com/Mumcord/mumbot", tag = "v0.4.1", features = ["tester"] }
mumcord-store = { workspace = true, features = ["test-util"] }
mumcord-audio = { workspace = true, features = ["test-backend"] }
netsim = { path = "../../tools/netsim" }
rcgen.workspace = true
# The link card test builds a query answer in the protobuf format, like the protocol crate does.
prost.workspace = true

[lints]
workspace = true
