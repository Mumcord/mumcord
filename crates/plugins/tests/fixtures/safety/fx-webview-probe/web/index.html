<!doctype html>
<meta charset="utf-8" />
<title>Fixture web view</title>
<!-- Probes what the sealed frame must not be able to do, then reports through the message
     bridge. The bridge is assumed to be window.parent.postMessage(string): adjust here if the
     host bridge ends up different. The probe URL can be set with ?probe=<url> and defaults to
     the port the end-to-end proxy listens on; the proxy log must stay empty (AC-6.16). -->
<pre id="out">probing</pre>
<pre id="echo">no echo</pre>
<!-- An external script: the frame policy refuses inline scripts. -->
<script src="probe.js"></script>
