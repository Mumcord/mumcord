[package]
name = "mumcord-p2p"
description = "Encrypted direct connections between Mumble clients: QUIC with certificate pinning, port mapping and signalling"
repository = "https://github.com/Mumcord/mumcord"
homepage = "https://github.com/Mumcord/mumcord"
documentation = "https://docs.rs/mumcord-p2p"
readme = "README.md"
keywords = ["mumble", "quic", "p2p", "nat", "voip"]
categories = ["network-programming"]
include = ["src/**", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
rustls.workspace = true
quinn.workspace = true
igd-next.workspace = true
crab_nat.workspace = true
netdev.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
socket2.workspace = true
mumcord-protocol.workspace = true

[dev-dependencies]
rcgen.workspace = true
# Path only, so the published package does not depend on mumcord-store.
mumcord-store = { path = "../store" }

[lints]
workspace = true
