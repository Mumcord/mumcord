[package]
name = "mumcord-store"
description = "Local persistence for Mumble clients: SQLite database, identity certificates and OS secure storage for secrets"
repository = "https://github.com/Mumcord/mumcord"
homepage = "https://github.com/Mumcord/mumcord"
documentation = "https://docs.rs/mumcord-store"
readme = "README.md"
keywords = ["mumble", "sqlite", "keyring", "client-certificate", "voip"]
categories = ["database", "authentication"]
include = ["src/**", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusqlite.workspace = true
keyring.workspace = true
rcgen.workspace = true
p12-keystore.workspace = true
rsa.workspace = true
sha1.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Public in-memory `SecretStore` for tests in other crates.
test-util = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
