[package]
name = "mumcord-camera"
description = "Camera capture: backend trait, frame pool, device list with hot-plug, and the test camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
crossbeam-queue.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# AVFoundation capture (FR-8.25): device list, permission, capture session; CoreMedia/CoreVideo
# for the delivered NV12 pixel buffers.
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSValue", "block2"] }
objc2-av-foundation = { workspace = true, features = ["AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat", "block2", "dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { workspace = true, features = ["CMBase", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }

[target.'cfg(target_os = "linux")'.dependencies]
# xdg-desktop-portal Camera: access request and the PipeWire remote with the camera nodes.
ashpd = { workspace = true, features = ["camera"] }
pipewire.workspace = true
# The portal calls are async; they run on a small runtime of their own (see linux/portal.rs).
tokio = { workspace = true, features = ["rt-multi-thread"] }
# poll() constants and errno values for the V4L2 capture loop.
libc.workspace = true
# V4L2 fallback when there is no camera portal (FR-8.25).
v4l = "0.14"
# MJPEG frames of USB 2 cameras (FR-8.26); already in the tree through `image`.
zune-jpeg = "0.5"
zune-core = "0.5"

[lints]
workspace = true
