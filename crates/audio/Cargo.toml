[package]
name = "mumcord-audio"
description = "Voice audio for Mumble clients: microphone and speaker I/O on top of mumcord-codec (Opus codec, jitter buffer, mixer, processing chain)"
repository = "https://github.com/Mumcord/mumcord"
homepage = "https://github.com/Mumcord/mumcord"
documentation = "https://docs.rs/mumcord-audio"
readme = "README.md"
keywords = ["mumble", "opus", "voip", "audio", "jitter-buffer"]
categories = ["multimedia::audio", "multimedia::encoding"]
include = ["src/**", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mumcord-codec.workspace = true
audio_thread_priority.workspace = true
cpal.workspace = true
rtrb.workspace = true
rubato.workspace = true
thiserror.workspace = true
tracing.workspace = true
hound = { workspace = true, optional = true }

[features]
# Env-selected null/WAV-file audio backend for headless tests and E2E; never in release builds.
test-backend = ["dep:hound"]

[dev-dependencies]
hound.workspace = true

# The PipeWire device list (every sink and source of a multi-endpoint interface as its own
# device, issue #183). Enabled on every platform except FreeBSD: there it is the Linux sound
# server, and FreeBSD's OSS needs no libpipewire.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
cpal = { workspace = true, features = ["pipewire"] }

# rtprio(2) for real-time audio threads (FR-13.17); Linux uses libc for the CPU-time limits.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio.workspace = true
futures.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
