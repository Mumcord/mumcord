[package]
name = "mumcord-audio"
description = "Voice audio for Mumble clients: microphone and speaker I/O on top of mumcord-codec (Opus codec, jitter buffer, mixer, processing chain)"
repository = "https://github.com/Mumcord/mumcord"
homepage = "https://github.com/Mumcord/mumcord"
documentation = "https://docs.rs/mumcord-audio"
readme = "README.md"
keywords = ["mumble", "opus", "voip", "audio", "jitter-buffer"]
categories = ["multimedia::audio", "multimedia::encoding"]
include = ["src/**", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mumcord-codec.workspace = true
dasp_sample.workspace = true
rtrb.workspace = true
rubato.workspace = true
thiserror.workspace = true
tracing.workspace = true
hound = { workspace = true, optional = true }

[features]
# Env-selected null/WAV-file audio backend for headless tests and E2E; never in release builds.
test-backend = ["dep:hound"]

[dev-dependencies]
hound.workspace = true

# Real-time scheduling for the device threads (cpal) and Mumcord's own audio threads (issue
# #123): rtkit over D-Bus on Linux, MMCSS on Windows. Desktop only: on Android and iOS the audio
# I/O and its thread priority come from the platform-fed backend (Epic 5, task 3.1), so cpal and
# the platform audio libraries it links are not built for them at all.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
cpal = { workspace = true, features = ["realtime-dbus"] }
audio_thread_priority = { workspace = true, features = ["with_dbus"] }

# The PipeWire device list (every sink and source of a multi-endpoint interface as its own
# device, issue #183). Enabled on the desktop platforms except FreeBSD: there it is the Linux
# sound server, and FreeBSD's OSS needs no libpipewire. Phones have no PipeWire either.
[target.'cfg(not(any(target_os = "freebsd", target_os = "android", target_os = "ios")))'.dependencies]
cpal = { workspace = true, features = ["pipewire"] }

# rtprio(2) for real-time audio threads (FR-13.17); Linux uses libc for the CPU-time limits.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio.workspace = true
futures.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
