name: Install npm dependencies
description: >-
  Sets up Node.js and restores node_modules from the cache, keyed by the exact package-lock.json,
  OS and Node version; runs npm ci only on a cache miss. Restoring takes seconds, npm ci about a
  minute. Only main saves it: those that change the lockfile
  run npm ci instead of filling the 10 GB repository cache with copies that evict main's caches.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - id: key
      shell: bash
      run: echo "key=node-modules-$RUNNER_OS-$RUNNER_ARCH-$(node --version)-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.key.outputs.key }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.key.outputs.key }}
