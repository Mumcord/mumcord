name: Feature request
description: Suggest an idea or improvement for Mumcord.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Mumcord is a pure client: features must work with any unmodified Mumble server.
        Check the [roadmap](https://github.com/Mumcord/mumcord/wiki/Roadmap) first – your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice and audio
        - Chat
        - Channels and people
        - Settings and setup
        - Notifications and sounds
        - Look and feel
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've considered
