name: Third-party notices

# Regenerates THIRD_PARTY_NOTICES, ui/public/third-party-notices.txt and its JSON form for the About
# window, ui/public/third-party-notices.json (scripts/generate-notices.sh), after dependency changes
# on main. When they changed, it opens or updates the pull request
# "chore: regenerate third-party notices" from the fixed branch chore/regenerate-notices; main is
# protected, so it never pushes there. A pull request opened with the workflow token starts no
# workflows by itself, so this workflow then starts CI and E2E on the branch (workflow_dispatch);
# their checks land on the pull request's head commit, which is what the required checks look at.
# Opening the pull request needs the repository setting "Allow GitHub Actions to create and
# approve pull requests"; without it the branch is still pushed and the run shows a warning with a
# link to open the pull request by hand. While the version sync pull request of a release is open
# (post-release.yml), which contains fresh notices as well, this workflow does nothing.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - package-lock.json
      - about.toml
      - licenses/**
      - scripts/generate-notices.sh
      - scripts/notices.js
      - scripts/license-tools.env
  workflow_dispatch:

# A newer push to main makes a running regeneration obsolete.
concurrency:
  group: notices
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Starts CI and E2E on the branch.
  actions: write

env:
  BRANCH: chore/regenerate-notices
  TITLE: "chore: regenerate third-party notices"

jobs:
  notices:
    name: Regenerate notices
    # The pull request always targets main, so a manual run on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tools
        run: grep '^[A-Z_]*=' scripts/license-tools.env >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cargo-tool
        with:
          crate: cargo-about
          version: ${{ steps.tools.outputs.CARGO_ABOUT_VERSION }}
          features: cli

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate notices
        run: scripts/generate-notices.sh

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(THIRD_PARTY_NOTICES ui/public/third-party-notices.txt ui/public/third-party-notices.json)
          sync=$(gh pr list --base main --state open --json number,headRefName \
            -q '[.[] | select(.headRefName | startswith("chore/sync-version-"))][0].number')
          if [[ -n "$sync" ]]; then
            echo "Version sync pull request #$sync is open and regenerates the notices; skipping."
            exit 0
          fi
          open=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          if git diff --quiet -- "${files[@]}"; then
            echo "The notices on main are up to date."
            if [[ -n "$open" ]]; then
              gh pr close "$open" --delete-branch --comment "The notices on main are up to date now."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "${files[@]}"
          git commit -m "$TITLE"
          # The branch only ever holds this one commit on top of main, so each run replaces it.
          git push --force origin "$BRANCH"

          if [[ -z "$open" ]]; then
            body="Regenerated by the [Third-party notices workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) after a dependency change on main (scripts/generate-notices.sh). CI and E2E are started on this branch by the same run."
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body" \
              || echo "::warning::Could not open the pull request (is \"Allow GitHub Actions to create and approve pull requests\" switched on?). Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run e2e.yml --ref "$BRANCH"
