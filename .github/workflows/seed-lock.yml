name: Seeder lock

# The smoke-test seeder is its own Cargo project, so the workspace checks never look at its lock.
# A stale lock only showed up when a release run built the seeder with --locked. Not a required
# check, hence the path filter on the trigger.
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "scripts/smoke/**"
      - ".github/workflows/seed-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-lock:
    name: Seeder lock is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Check the lock
        run: cargo metadata --locked --format-version 1 --manifest-path scripts/smoke/seed/Cargo.toml > /dev/null
