name: Fuzzing

# Runs the cargo-fuzz targets in fuzz/ (the decoders for bytes from servers and other users) for a
# few minutes each. Weekly and on demand only, not on pull requests: a crash it finds is a bug to
# fix in its own pull request, not a reason to block unrelated merges. A crash fails the job and
# uploads the crashing input as an artifact; how to reproduce it: CONTRIBUTING.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [control_frame, voice_packet, mumcord_hello]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mumcord_hello links the engine, which needs the same system libraries as the app build
      # (ci.yml). A stalled mirror fails the step instead of holding the job.
      - name: Install Linux system libraries
        timeout-minutes: 20
        run: |
          scripts/ci/apt-install.sh \
            libasound2-dev libvpx-dev libpipewire-0.3-dev libclang-dev pkg-config cmake

      - name: Native AV1 libraries
        uses: ./.github/actions/native-av1

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Builds against the app's lockfile so the fuzzed code matches what ships.
      - name: Fuzz
        run: |
          cp Cargo.lock fuzz/
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=300

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
