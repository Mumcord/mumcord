name: CI

# Branch pushes run through their pull request; a push trigger on every branch ran the whole
# matrix twice. A branch without a pull request can be checked with a manual run.
on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: CI only needs pass/fail, and it makes linking faster and the caches smaller.
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  # Decides whether the heavy jobs run. A path filter on the trigger would leave the required
  # checks pending forever on pull requests without code changes, so the checks always report.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Lists the changed files of the pull request through the API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - id: filter
        run: scripts/ci/code-changed.sh >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Always runs, outside the changes gate: workflow and script edits alone skip the build jobs, so
  # this fast job is the only check they get. Needs no build.
  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's preinstalled shellcheck changes with the image, so both tools are downloaded
      # at fixed versions and verified; actionlint runs the same shellcheck on inline run: scripts.
      - name: Install actionlint and shellcheck
        run: |
          mkdir -p "$HOME/lint-bin"
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$HOME/lint-bin" actionlint
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 -C "$HOME/lint-bin" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/lint-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: scripts/ci/lint-ci.sh

      - name: Test smoke helper
        run: bash scripts/ci/test-smoke.sh

  # Released versions' CHANGELOG.md sections are part of the release and must not change
  # (RELEASING.md, "Release integrity"). Cheap, so it runs on every pull request, outside the
  # changes gate; it needs only CHANGELOG.md and scripts.
  changelog:
    name: Released changelog sections
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The merge commit's first parent is the current base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Test the check
        run: scripts/ci/test-check-changelog-released.sh

      - name: Check released sections
        run: |
          git show HEAD^1:CHANGELOG.md > "$RUNNER_TEMP/base-changelog.md"
          scripts/ci/check-changelog-released.sh "$RUNNER_TEMP/base-changelog.md" CHANGELOG.md

  # Always runs, outside the changes gate: a pull request that only bumps a lockfile or adds a
  # crate should still be checked. The same workflow runs weekly on main (dependency-audit.yml).
  dependencies:
    name: Dependency checks
    uses: ./.github/workflows/dependency-audit.yml

  # The plugin SDK bundles a prebuilt Bovnar library for wasm32 (spec FR-9.96). Rebuild it from
  # the Bovnar version pinned in Cargo.lock with the pinned compiler and fail when it, or its
  # licence files, differ from the committed copies. Cheap, so it runs outside the changes gate.
  bovnar-wasm:
    name: Bundled Bovnar library
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild and compare
        run: |
          scripts/build-bovnar-wasm.sh "$RUNNER_TEMP/bovnar-wasm"
          for f in libbovnar_wasm.a LICENSE THIRD_PARTY_NOTICES.md; do
            cmp "$RUNNER_TEMP/bovnar-wasm/$f" "crates/plugin-sdk/bovnar-wasm/$f" || {
              echo "::error::crates/plugin-sdk/bovnar-wasm/$f does not match the pinned Bovnar; run scripts/build-bovnar-wasm.sh"
              exit 1
            }
          done

  # Runs the bounded fuzz harness of every network decoder of the media profile (media reader,
  # description, channel-0 kinds, legacy header, SFrame header and opener, direct-track decoder,
  # key-exchange chunk and update decoders) over the committed corpus (FR-7.94, AC-7.83). The job
  # decides from the changed paths whether it has anything to test, so an unrelated pull request
  # skips the build; every push always runs it.
  media-fuzz:
    name: Media decoder fuzzing
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The first parent of a pull request's merge commit is its base.
          fetch-depth: 2

      - name: Decode changed paths
        id: filter
        run: |
          run=false
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            run=true
          else
            while IFS= read -r file; do
              case "$file" in
                crates/p2p/src/media/* | crates/p2p/src/broadcast.rs) run=true ;;
                crates/engine/src/screen_share/broadcast/*) run=true ;;
                crates/p2p/tests/media_fuzz.rs | crates/p2p/tests/corpus/*) run=true ;;
                crates/engine/tests/media_fuzz.rs | crates/engine/tests/corpus/*) run=true ;;
                Cargo.toml | Cargo.lock | crates/p2p/Cargo.toml | crates/engine/Cargo.toml) run=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: apt cache key
        id: apt
        if: steps.filter.outputs.run == 'true'
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      # Restores what the Linux build-test jobs save; this job never writes the shared cache.
      - name: Restore apt packages
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-${{ steps.apt.outputs.image }}

      - name: Install Linux system libraries
        if: steps.filter.outputs.run == 'true'
        timeout-minutes: 20
        run: |
          # libdbus-1-dev: mumcord-engine links audio_thread_priority through cpal, which
          # builds libdbus-sys. The app jobs get it transitively from libwebkit2gtk.
          scripts/ci/apt-install.sh --cache-dir "$HOME/apt-archives" \
            libasound2-dev libvpx-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev \
            pkg-config cmake

      - uses: ./.github/actions/native-av1
        if: steps.filter.outputs.run == 'true'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.filter.outputs.run == 'true'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.filter.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: media-fuzz

      - name: Fuzz the p2p decoders
        if: steps.filter.outputs.run == 'true'
        run: cargo test -p mumcord-p2p --locked --test media_fuzz -- --ignored --test-threads=1 --nocapture

      - name: Fuzz the screen-share decoders
        if: steps.filter.outputs.run == 'true'
        run: cargo test -p mumcord-engine --locked --test media_fuzz -- --ignored --test-threads=1 --nocapture

  # Two jobs per OS that run side by side, each about half the old single job: "check" (format,
  # clippy, the app build on Windows/macOS and the CI script tests) and "test" (cargo test). They
  # build different artifacts (check metadata vs. test binaries), so each keeps its own cache.
  build-test:
    name: ${{ matrix.task == 'check' && 'Lint and app build' || 'Rust tests' }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        task: [check, test]
        exclude:
          # macOS runners are scarce: with two macOS jobs per run, the test job often waited 15
          # minutes for a runner and was cancelled, failing the whole run. The macOS "check" job
          # runs the tests too, so each run needs one macOS runner.
          - os: macos-latest
            task: test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version the app shows (RELEASING.md); the manifests keep the last release's version.
      - name: Set display version
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "MUMCORD_VERSION=dev~${SHA::7}" >> "$GITHUB_ENV"

      # The runner's Ubuntu mirror is often very slow (30 kB/s: 40 min for 70 MB), so the downloaded
      # packages are cached per runner image; apt then only downloads what changed. The cache is
      # saved even when the step times out, so a slow first download is not lost.
      - name: apt cache key
        id: apt
        if: runner.os == 'Linux'
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ steps.apt.outputs.image }}
          restore-keys: apt-${{ matrix.os }}-

      # A stalled mirror fails the step instead of holding the job for most of an hour.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          scripts/ci/apt-install.sh --cache-dir "$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libasound2-dev libvpx-dev libpipewire-0.3-dev libclang-dev pkg-config cmake

      # apt's lock and partial downloads are root-only and must not go into the cache.
      - name: Clean apt cache
        if: always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        run: sudo rm -rf ~/apt-archives/lock ~/apt-archives/partial

      - name: Save apt packages
        if: always() && github.ref == 'refs/heads/main' && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ steps.apt.outputs.image }}

      # Screen sharing links a static libvpx on Windows and macOS (scripts/build-libvpx.sh,
      # RELEASING.md). It is cached: the key changes with the script and, on Windows, with the
      # libvpx version of the runner's vcpkg.
      - name: libvpx cache key
        id: libvpx
        if: runner.os != 'Linux'
        shell: bash
        run: |
          version=pinned
          if [[ "$RUNNER_OS" == Windows ]]; then
            # No \( interpolation: Git Bash's path conversion rewrites "-\(" in arguments.
            version=$(jq -r '(.version // ."version-semver" // ."version-string" | tostring) + "-" + (."port-version" // 0 | tostring)' \
              "$VCPKG_INSTALLATION_ROOT/ports/libvpx/vcpkg.json")
          fi
          echo "key=libvpx-$RUNNER_OS-$version-${{ hashFiles('scripts/build-libvpx.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore static libvpx
        id: libvpx-cache
        if: runner.os != 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libvpx
          key: ${{ steps.libvpx.outputs.key }}

      - name: Build static libvpx
        if: runner.os != 'Linux' && steps.libvpx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install nasm; fi
          scripts/build-libvpx.sh '${{ runner.temp }}/libvpx'

      - name: Save static libvpx
        if: runner.os != 'Linux' && steps.libvpx-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libvpx
          key: ${{ steps.libvpx.outputs.key }}

      # bindgen (crates/screenshare/build.rs) loads libclang: LLVM on the Windows runner, Xcode's
      # toolchain on macOS.
      - name: Point the build at libvpx and libclang
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            libclang='C:\Program Files\LLVM\bin'
            test -f "$libclang/libclang.dll"
          else
            libclang="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
            test -f "$libclang/libclang.dylib"
          fi
          {
            echo 'LIBVPX_STATIC_DIR=${{ runner.temp }}/libvpx'
            echo "LIBCLANG_PATH=$libclang"
          } >> "$GITHUB_ENV"

      # Screen sharing's AV1 libraries (SVT-AV1, dav1d, and the hardware encoder interfaces except
      # on macOS), built from the pinned versions of their scripts and cached per system and
      # architecture.
      - name: Native AV1 libraries
        uses: ./.github/actions/native-av1

      # wasm32: the plugin SDK build test and the safety fixtures below (Linux only).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ runner.os == 'Linux' && 'wasm32-unknown-unknown' || '' }}

      # Pull requests only restore: each one saving its own ~1 GB copy filled the 10 GB repository
      # cache and evicted main's caches, so later runs started cold.
      # Only main saves: PR-scoped caches are unreadable by other PRs, and at 1-1.5 GB each they push
      # the repository over the 10 GB limit, which evicts the small apt cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.task }}

      - uses: ./.github/actions/npm-ci

      - name: Rust format
        if: matrix.task == 'check'
        run: cargo fmt --all --check

      - name: Rust lint
        if: matrix.task == 'check'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The live engine tests only exist with this feature, so the lint above never compiles them.
      - name: Live engine tests compile
        if: matrix.task == 'check'
        run: cargo clippy -p mumcord-engine --features test-backend --tests --locked -- -D warnings

      # The smoke-test seeder is its own Cargo project outside the workspace, so the steps above
      # never compile it. Checking it here catches store/protocol API changes that would
      # otherwise only break the Smoke jobs of the test builds.
      - name: Smoke seeder builds
        if: matrix.task == 'check' && runner.os == 'Linux'
        run: cargo clippy --manifest-path scripts/smoke/seed/Cargo.toml --locked -- -D warnings

      - name: Rust tests
        if: matrix.task == 'test' || runner.os == 'macOS'
        run: cargo test --workspace --locked

      # The headless bot builds mumcord-codec for static musl binaries, so it must stay lint-clean,
      # tested and free of the device crates (cpal/ALSA) and the resampler.
      - name: Codec crate lint
        if: matrix.task == 'check' && runner.os == 'Linux'
        run: |
          cargo clippy -p mumcord-codec --all-targets --locked -- -D warnings
          if cargo tree -p mumcord-codec -e normal --locked | grep -iE 'cpal|alsa|rubato'; then
            echo "mumcord-codec must not depend on cpal, alsa or rubato" >&2
            exit 1
          fi

      - name: Codec crate tests
        if: matrix.task == 'test' && runner.os == 'Linux'
        run: cargo test -p mumcord-codec --locked

      # The plugin crates' tests (runtime, frozen WIT snapshot, SDK, CLI scenarios) run in "Rust
      # tests" above. These cover what that skips: a plugin built with the SDK for wasm32 through
      # the CLI (new, reproducible build, check, sign), and the safety fixtures, whose builder is a
      # Cargo project outside the workspace. Both share the workspace target dir and its cache.
      - name: Plugin SDK build test
        if: matrix.task == 'test' && runner.os == 'Linux'
        run: cargo test -p mumcord-plugin --test author_flow --locked -- --ignored

      - name: Plugin fixture builder lint
        if: matrix.task == 'check' && runner.os == 'Linux'
        run: cargo clippy --manifest-path crates/plugins/tests/fixtures/safety/builder/Cargo.toml --locked -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Plugin safety fixtures build
        if: matrix.task == 'test' && runner.os == 'Linux'
        run: scripts/build-plugin-fixtures.sh "$RUNNER_TEMP/plugin-fixtures"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      # release.yml and publish-crates.yml set the tag's version with this script before building.
      - name: Version script
        if: matrix.task == 'check' && runner.os == 'Linux'
        run: |
          scripts/ci/test-set-version.sh
          scripts/ci/test-set-version.sh 9.8.7-rc.2

      # release.yml decides with these scripts which tags build a release or a release candidate
      # and how a release candidate's .deb is versioned.
      - name: Release candidate scripts
        if: matrix.task == 'check' && runner.os == 'Linux'
        run: |
          scripts/ci/test-release-tag.sh
          scripts/ci/test-deb-set-version.sh

      - name: Changelog script
        if: matrix.task == 'check' && runner.os == 'Linux'
        run: scripts/ci/test-finalise-changelog.sh

      - name: Notices script
        if: matrix.task == 'check' && runner.os == 'Linux'
        run: scripts/ci/test-notices.sh

      # build-and-smoke.yml signs the Windows release through these scripts; test their argument
      # handling on every PR, since the real signing only runs for release tags.
      - name: Windows signing scripts
        if: matrix.task == 'check' && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci/totp.test.ps1
          ./scripts/ci/sign-windows.test.ps1

      # Linux is covered by the E2E build job, which builds the same app.
      - name: Tauri debug build
        if: matrix.task == 'check' && runner.os != 'Linux'
        run: npm run tauri build -- --debug --no-bundle -- --locked

  # The UI checks are platform-independent (vitest runs in jsdom), so they run once, on Linux, in
  # parallel with the Rust jobs. The ubuntu-24.04 result check below requires this job.
  ui:
    name: UI checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/npm-ci

      - name: UI lint
        run: npm run lint

      - name: UI typecheck
        run: npm run typecheck

      - name: UI tests
        # The whole suite takes a few minutes. A waitFor callback that keeps changing the DOM
        # starves vitest's own timers, so only this limit stops such a hang early.
        timeout-minutes: 10
        run: npm test

  # The phone apps (spec 05) build the engine with `--no-default-features` for Android and iOS.
  # The desktop jobs above only ever build the default features, so the four jobs below keep the
  # phone build from breaking. They are not part of the required "result" checks.
  #
  # Their own gate: narrower than "changes" (UI-only changes cannot break the engine) and it
  # counts an edit of this workflow, which "changes" ignores.
  mobile-changes:
    name: Changed engine files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Lists the changed files of the pull request through the API.
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - id: filter
        shell: bash
        run: |
          engine=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            engine=false
            while IFS= read -r file; do
              case "$file" in
                crates/* | Cargo.toml | Cargo.lock | .github/workflows/ci.yml)
                  echo "engine change: $file" >&2
                  engine=true
                  break
                  ;;
              esac
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" -q '.[].filename')
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # The engine without the desktop features, and with each desktop feature alone, on Linux: the
  # cheapest place to catch code that only compiles when all of them are on.
  engine-mobile-linux:
    name: Engine without desktop features (Linux)
    needs: mobile-changes
    if: needs.mobile-changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restores the packages the "build-test" Linux jobs saved (a superset of the ones needed
      # here); those jobs own the cache, so nothing is saved here.
      - name: apt cache key
        id: apt
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-${{ steps.apt.outputs.image }}
          restore-keys: apt-ubuntu-24.04-

      # ALSA and cmake: the audio devices and the bundled Opus, needed without any feature. D-Bus:
      # libdbus-sys (cpal's real-time priority, keyring); the desktop build gets it with WebKitGTK.
      # The rest is for the single features: libvpx (vp9), PipeWire and libclang (screen-capture).
      - name: Install Linux system libraries
        timeout-minutes: 20
        run: |
          scripts/ci/apt-install.sh --cache-dir "$HOME/apt-archives" \
            libasound2-dev libdbus-1-dev libvpx-dev libpipewire-0.3-dev libclang-dev pkg-config cmake

      # For the features av1-decode (dav1d) and desktop-codecs (SVT-AV1, hardware encoders).
      - name: Native AV1 libraries
        uses: ./.github/actions/native-av1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: engine-mobile

      - name: Lint without desktop features
        run: cargo clippy -p mumcord-engine --no-default-features --all-targets --locked -- -D warnings

      - name: Tests without desktop features
        run: cargo test -p mumcord-engine --no-default-features --locked

      # Each feature alone: a feature that silently relies on another one fails here. Clippy
      # rather than check, so an import that is only unused in one combination fails too.
      - name: Lint each desktop feature alone
        shell: bash
        run: |
          status=0
          for feature in positional camera-effects screen-capture mumble-import vp9 av1-decode desktop-codecs; do
            echo "::group::feature $feature"
            cargo clippy -p mumcord-engine --no-default-features --features "$feature" --all-targets --locked -- -D warnings || {
              echo "::error::mumcord-engine does not build cleanly with only the feature $feature"
              status=1
            }
            echo "::endgroup::"
          done
          exit "$status"

  # The engine for the two Android ABIs (arm64-v8a for phones, x86_64 for the emulator). Its
  # dependency tree still compiles C code (ring, SQLite, Opus, Bovnar), hence the NDK.
  engine-android:
    name: Engine for Android
    needs: mobile-changes
    if: needs.mobile-changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The versions the mobile repository builds with.
      ANDROID_NDK_VERSION: 30.0.16248370
      CARGO_NDK_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image ships the Android SDK and cmake, but its NDK versions change with the
      # image. Not cached: the NDK is about 2 GB and would evict main's build caches.
      - name: Install the Android NDK
        timeout-minutes: 15
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: ./.github/actions/cargo-tool
        with:
          crate: cargo-ndk
          version: ${{ env.CARGO_NDK_VERSION }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: engine-android

      - name: Check
        run: cargo ndk -t arm64-v8a -t x86_64 check -p mumcord-engine --no-default-features --locked

      # Also compiles the unit tests, so the Android-only code paths and their tests are linted.
      - name: Lint
        run: cargo ndk -t arm64-v8a -t x86_64 clippy -p mumcord-engine --no-default-features --all-targets --locked -- -D warnings

  # The engine for iOS devices and the simulator, in its own job so a failure points at iOS
  # alone. macOS runners are scarce and expensive: clippy only (it includes the check), cached.
  engine-ios:
    name: Engine for iOS
    needs: mobile-changes
    if: needs.mobile-changes.outputs.engine == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: engine-ios

      - name: Lint for iOS devices
        run: cargo clippy -p mumcord-engine --no-default-features --all-targets --target aarch64-apple-ios --locked -- -D warnings

      - name: Lint for the iOS simulator
        run: cargo clippy -p mumcord-engine --no-default-features --all-targets --target aarch64-apple-ios-sim --locked -- -D warnings

  # Required status checks, one per OS under the old names. Runs even when the build was
  # skipped (no code change), because a skipped matrix job would not report these names.
  # FreeBSD (spec 13 §10): the same checks on a real FreeBSD machine, in a VM on a Linux runner.
  # Only the parts that can differ from Linux run here — check, clippy and the Rust tests — because
  # the UI checks and the app builds already run on the three supported platforms above.
  freebsd:
    name: FreeBSD 15.1
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version the app shows, as on the other platforms (RELEASING.md).
      - name: Display version
        id: version
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "value=dev~${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check, clippy and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          usesh: true
          mem: 8192
          cpu: 4
          prepare: |
            # git: the plugin tool's publish test runs git. cmake and gmake build the bundled
            # libopus (cpal -> opusic-sys) from source.
            pkg install -y git rust node24 npm protobuf python3 pkgconf cmake gmake ca_root_nss \
              alsa-lib alsa-plugins libvpx svt-av1 dav1d webkit2-gtk_41 gtk3 \
              libayatana-appindicator
          run: |
            set -e
            export PATH="$HOME/.cargo/bin:$PATH"
            # The version the app reports, as on the other platforms. Set here rather than in the
            # step's env: the action runs this script inside the VM, which does not see it.
            export MUMCORD_VERSION="${{ steps.version.outputs.value }}"
            export CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=4
            cargo check --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked

  result:
    name: ${{ matrix.os }}
    needs: [changes, build-test, ui, freebsd]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "changes: $CHANGES, build: $BUILD, ui: $UI, freebsd: $FREEBSD"
          [ "$CHANGES" = success ] || exit 1
          [ "$BUILD" = success ] || [ "$BUILD" = skipped ] || exit 1
          # The FreeBSD job runs once and gates the whole run, like the UI checks.
          [ "$OS" != ubuntu-24.04 ] || [ "$FREEBSD" = success ] || [ "$FREEBSD" = skipped ] || exit 1
          # The UI checks run once and count for the Linux check only.
          [ "$OS" != ubuntu-24.04 ] || [ "$UI" = success ] || [ "$UI" = skipped ]
        env:
          OS: ${{ matrix.os }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build-test.result }}
          UI: ${{ needs.ui.result }}
          FREEBSD: ${{ needs.freebsd.result }}
