name: CI

# Branch pushes run through their pull request; a push trigger on every branch ran the whole
# matrix twice. A branch without a pull request can be checked with a manual run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: CI only needs pass/fail, and it makes linking faster and the caches smaller.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Decides whether the heavy jobs run. A path filter on the trigger would leave the required
  # checks pending forever on pull requests without code changes, so the checks always report.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - id: filter
        run: scripts/ci/code-changed.sh >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The runner's Ubuntu mirror is often very slow (30 kB/s: 40 min for 70 MB), so the downloaded
      # packages are cached per runner image; apt then only downloads what changed. The cache is
      # saved even when the step times out, so a slow first download is not lost.
      - name: apt cache key
        id: apt
        if: runner.os == 'Linux'
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ steps.apt.outputs.image }}
          restore-keys: apt-${{ matrix.os }}-

      # A stalled mirror fails the step instead of holding the job for most of an hour.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          scripts/ci/apt-install.sh --cache-dir "$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libasound2-dev libvpx-dev libpipewire-0.3-dev libclang-dev pkg-config cmake

      # apt's lock and partial downloads are root-only and must not go into the cache.
      - name: Clean apt cache
        if: always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        run: sudo rm -rf ~/apt-archives/lock ~/apt-archives/partial

      - name: Save apt packages
        if: always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ steps.apt.outputs.image }}

      # Screen sharing links a static libvpx on Windows and macOS (scripts/build-libvpx.sh,
      # RELEASING.md). It is cached: the key changes with the script and, on Windows, with the
      # libvpx version of the runner's vcpkg.
      - name: libvpx cache key
        id: libvpx
        if: runner.os != 'Linux'
        shell: bash
        run: |
          version=pinned
          if [[ "$RUNNER_OS" == Windows ]]; then
            # No \( interpolation: Git Bash's path conversion rewrites "-\(" in arguments.
            version=$(jq -r '(.version // ."version-semver" // ."version-string" | tostring) + "-" + (."port-version" // 0 | tostring)' \
              "$VCPKG_INSTALLATION_ROOT/ports/libvpx/vcpkg.json")
          fi
          echo "key=libvpx-$RUNNER_OS-$version-${{ hashFiles('scripts/build-libvpx.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore static libvpx
        id: libvpx-cache
        if: runner.os != 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/libvpx
          key: ${{ steps.libvpx.outputs.key }}

      - name: Build static libvpx
        if: runner.os != 'Linux' && steps.libvpx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install nasm; fi
          scripts/build-libvpx.sh '${{ runner.temp }}/libvpx'

      # bindgen (crates/screenshare/build.rs) loads libclang: LLVM on the Windows runner, Xcode's
      # toolchain on macOS.
      - name: Point the build at libvpx and libclang
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            libclang='C:\Program Files\LLVM\bin'
            test -f "$libclang/libclang.dll"
          else
            libclang="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
            test -f "$libclang/libclang.dylib"
          fi
          {
            echo 'LIBVPX_STATIC_DIR=${{ runner.temp }}/libvpx'
            echo "LIBCLANG_PATH=$libclang"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      # The UI checks are platform-independent (vitest runs in jsdom), so they run on Linux only.
      # They stay in this job because its name is a required check for main.
      - name: UI lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: UI typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: UI tests
        if: runner.os == 'Linux'
        run: npm test

      # Linux is covered by the E2E build job, which builds the same app.
      - name: Tauri debug build
        if: runner.os != 'Linux'
        run: npm run tauri build -- --debug --no-bundle

  # Required status checks, one per OS under the old names. Runs even when the build was
  # skipped (no code change), because a skipped matrix job would not report these names.
  result:
    name: ${{ matrix.os }}
    needs: [changes, build-test]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "changes: $CHANGES, build: $BUILD"
          [ "$CHANGES" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; }
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build-test.result }}
