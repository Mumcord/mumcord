name: Build and smoke

# Reusable: builds the unsigned bundles (Linux AppImage, Windows NSIS installer and portable zip,
# macOS universal DMG), uploads them as workflow artifacts, then installs each one on a fresh runner and
# smoke-tests it against a local Mumble server (scripts/smoke/smoke.sh). Called by
# test-builds.yml (spec §10, AC-1.30) and release.yml (QA.12). Test builds are never signed.
# Release builds sign and notarize the macOS DMG only when the Apple secrets exist, and sign the
# Windows app and installer with the Certum certificate through SimplySign only when the Certum
# secrets and variable exist (docs/release-signing.md); without them those bundles are built unsigned.
# Release builds also bundle the third-party notices that release.yml regenerated (artifact
# third-party-notices) and upload the list of bundled native libraries for its SBOM job.
on:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_P8:
        required: false
      CERTUM_USER:
        required: false
      CERTUM_TOTP_SECRET:
        required: false
    inputs:
      release:
        description: Build for a tagged release instead of a test build.
        type: boolean
        default: false
      version:
        description: >-
          Release version (X.Y.Z) to set in all manifests and show in the app. Empty for a test
          build: the bundles get the last release's version and the app shows dev~<commit>.
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  # Official Mumble server for the native Windows/macOS smoke servers (Linux uses testenv).
  MUMBLE_SERVER_VERSION: 1.5.939

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage, .deb and .rpm (FR-2.53) for x86_64 and, on GitHub's ARM runner, ARM64.
          - name: linux
            os: ubuntu-24.04
            args: --bundles appimage,deb,rpm --config src-tauri/tauri.onnxruntime.linux.json
            bundle: target/release/bundle/{appimage/*.AppImage,deb/*.deb,rpm/*.rpm}
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --bundles appimage,deb,rpm --config src-tauri/tauri.onnxruntime.linux.json
            bundle: target/release/bundle/{appimage/*.AppImage,deb/*.deb,rpm/*.rpm}
          - name: windows
            os: windows-latest
            args: --bundles nsis --config src-tauri/tauri.onnxruntime.windows.json
            # The installer and the portable zip (packaged below from the same Mumcord.exe).
            bundle: target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-portable.zip
          # One DMG for Apple Silicon and Intel Macs. The smoke test on the arm64 runner
          # exercises the arm64 half. "app" keeps Mumcord.app after the DMG is built (Tauri
          # deletes it otherwise); releases pack it into the updater archive.
          - name: macos
            os: macos-latest
            args: --bundles app,dmg --target universal-apple-darwin --config src-tauri/tauri.onnxruntime.macos.json
            onnxruntime-target: universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The Certum signing secrets exist only in the "release" environment, which accepts only
    # version tags.
    environment: ${{ (inputs.release && matrix.name == 'windows') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7

      # Releases bundle the notices release.yml regenerated from the tagged commit.
      - name: Use the regenerated third-party notices
        if: inputs.release
        uses: actions/download-artifact@v8
        with:
          name: third-party-notices

      # The runner's Ubuntu mirror is often very slow, so the downloaded packages are cached per
      # runner image and only main saves them; PRs restore read-only.
      - name: apt cache key 
        id: apt
        if: runner.os == 'Linux'
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-build-${{ matrix.os }}-${{ steps.apt.outputs.image }}
          restore-keys: apt-build-${{ matrix.os }}-

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          scripts/ci/apt-install.sh --cache-dir "$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config cmake patchelf xdg-utils \
            gstreamer1.0-plugins-bad

      # apt's lock and partial downloads are root-only and must not go into the cache.
      - name: Clean apt cache
        if: always() && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        run: sudo rm -rf ~/apt-archives/lock ~/apt-archives/partial

      - name: Save apt packages
        if: always() && github.ref == 'refs/heads/main' && runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-build-${{ matrix.os }}-${{ steps.apt.outputs.image }}

      # Screen sharing links a static libvpx into every bundle (scripts/build-libvpx.sh,
      # RELEASING.md); on Linux this keeps the packages off the build host's libvpx soname. It is
      # cached per system and architecture: the key changes with the script and, on Windows, with
      # the libvpx version of the runner's vcpkg.
      - name: libvpx cache key
        id: libvpx
        shell: bash
        run: |
          version=pinned
          if [[ "$RUNNER_OS" == Windows ]]; then
            version=$(jq -r '(.version // ."version-semver" // ."version-string" | tostring) + "-" + (."port-version" // 0 | tostring)' \
              "$VCPKG_INSTALLATION_ROOT/ports/libvpx/vcpkg.json")
          fi
          echo "key=libvpx-$RUNNER_OS-$RUNNER_ARCH-$version-${{ hashFiles('scripts/build-libvpx.sh') }}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore static libvpx
        id: libvpx-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/libvpx
          key: ${{ steps.libvpx.outputs.key }}

      - name: Build static libvpx
        if: steps.libvpx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install nasm; fi
          if [[ "$RUNNER_OS" == Linux ]]; then scripts/ci/apt-install.sh nasm; fi
          scripts/build-libvpx.sh '${{ runner.temp }}/libvpx'

      - name: Save static libvpx
        if: steps.libvpx-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/libvpx
          key: ${{ steps.libvpx.outputs.key }}

      # bindgen (crates/screenshare/build.rs) loads libclang: LLVM on the Windows runner, Xcode's
      # toolchain on macOS, libclang-dev (found on its own) on Linux.
      - name: Point the build at libvpx and libclang
        shell: bash
        run: |
          echo 'LIBVPX_STATIC_DIR=${{ runner.temp }}/libvpx' >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then exit 0; fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            libclang='C:\Program Files\LLVM\bin'
            test -f "$libclang/libclang.dll"
          else
            libclang="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
            test -f "$libclang/libclang.dylib"
          fi
          echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"

      # Screen sharing's AV1 libraries (SVT-AV1, dav1d, and the hardware encoder interfaces except
      # on macOS), built from the pinned versions of their scripts and cached per system and
      # architecture.
      - name: Native AV1 libraries
        uses: ./.github/actions/native-av1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # After rust-cache, whose key hashes the manifests. Installers need a numeric version (RPM
      # rejects '-', MSI/NSIS and macOS want X.Y.Z), so a test build packages as the last release
      # and only the version shown in the app says dev~<commit> (RELEASING.md).
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$VERSION" ]]; then
            display=$VERSION
          else
            VERSION=$(scripts/latest-release-version.sh)
            display="dev~${SHA::7}"
          fi
          scripts/set-version.sh "$VERSION"
          echo "MUMCORD_VERSION=$display" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      # Tauri imports the certificate into a temporary keychain, signs with the hardened runtime
      # and entitlements, then notarizes and staples. All of that is switched on by these env vars.
      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS' && inputs.release
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::Apple secret $v is not set: building the macOS DMG unsigned."
              exit 0
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
            echo "MUMCORD_MACOS_SIGNED=true"
          } >> "$GITHUB_ENV"

      - name: Check Windows signing setup
        id: certum
        if: runner.os == 'Windows' && inputs.release
        shell: bash
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          for v in CERTUM_USER CERTUM_TOTP_SECRET CERTUM_CERT_SHA1; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::$v is not set in the release environment: building the Windows installer unsigned."
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Camera background effects (spec 08, FR-8.33): the pinned, checksum-verified ONNX Runtime
      # library goes into every bundle through the src-tauri/tauri.onnxruntime.<os>.json overlay
      # in the build arguments (Linux /usr/lib/mumcord, Windows next to Mumcord.exe with the
      # Visual C++ runtime it needs, macOS Contents/Frameworks, signed with the app).
      - name: Stage ONNX Runtime
        run: node scripts/stage-onnxruntime.js ${{ matrix.onnxruntime-target }}

      # The AppImage bundles the GStreamer plugins (bundleMediaFramework) but not H.264 (gst-libav,
      # x264) or the GPL-only codecs; see RELEASING.md. The deb/rpm packages depend on gst-libav instead.
      - name: Exclude H.264 and GPL-only GStreamer plugins from the AppImage
        if: runner.os == 'Linux'
        run: |
          echo "GSTREAMER_PLUGINS_DIR=$(scripts/filter-gst-plugins.sh)" >> "$GITHUB_ENV"
          # linuxdeploy only finds the plugin scanner by itself on Debian paths; pass it explicitly.
          echo "GSTREAMER_HELPERS_DIR=$(scripts/gst-helpers-dir.sh)" >> "$GITHUB_ENV"

      # --locked: the bundle is built from exactly the dependencies in Cargo.lock, the same ones the
      # notices job read (scripts/generate-notices.sh), or the build fails instead of resolving anew.
      - name: Build bundle
        if: steps.certum.outputs.enabled != 'true'
        run: npm run tauri build -- ${{ matrix.args }} -- --locked

      # Signed Windows release: Tauri signs the app exe, the uninstaller and the installer through
      # scripts/sign-windows.ps1 (signtool with the Certum certificate from SimplySign Desktop),
      # so the installer contains the signed exe. The signCommand lives only in this CI overlay,
      # never in tauri.conf.json, so local builds stay unsigned. The app is compiled before the
      # SimplySign login so the cloud session is fresh when the first file is signed.
      - name: Build Windows app for signing
        if: steps.certum.outputs.enabled == 'true'
        run: npm run tauri build -- --no-bundle --config src-tauri/tauri.onnxruntime.windows.json -- --locked

      # Certum's official installer, pinned by version and checksum. A new version needs a new
      # checksum (docs/release-signing.md); the URL follows Certum's download server layout.
      - name: Install SimplySign Desktop
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIMPLYSIGN_VERSION: 9.4.5.95
          SIMPLYSIGN_SHA256: 6309e8b46f1f4e786288e777aef515a2c30d885165b71a21191e9941badebd6b
        run: |
          $version = $env:SIMPLYSIGN_VERSION
          $msi = "$env:RUNNER_TEMP\SimplySignDesktop.msi"
          Invoke-WebRequest "https://files.certum.eu/software/SimplySignDesktop/Windows/$version/SimplySignDesktop-$version-64-bit-en.msi" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne $env:SIMPLYSIGN_SHA256) { throw "SimplySign Desktop installer checksum mismatch: $hash" }
          $proc = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\simplysign-install.log`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "SimplySign Desktop installation failed (msiexec exit code $($proc.ExitCode))." }

      - name: Check the TOTP generator and signing script
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        run: |
          ./scripts/ci/totp.test.ps1
          ./scripts/ci/sign-windows.test.ps1

      # Types the account and a fresh TOTP code into SimplySign Desktop (scripts/ci/simplysign-login.ps1).
      # Fragile by nature; when it fails, the release fails and the maintainer signs by hand.
      - name: Log in to SimplySign
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        timeout-minutes: 10
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          # GitHub masks secrets already; also mask the account name in every form it may take.
          Write-Host "::add-mask::$env:CERTUM_USER"
          ./scripts/ci/simplysign-login.ps1

      - name: Bundle and sign Windows installer
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          $overlay = "$env:RUNNER_TEMP\tauri.signing.json"
          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd  = 'pwsh'
                  args = @('-NoProfile', '-NonInteractive', '-File', "$env:GITHUB_WORKSPACE\scripts\sign-windows.ps1", '%1')
                }
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $overlay
          npm run tauri bundle -- --bundles nsis --config $overlay --config src-tauri/tauri.onnxruntime.windows.json
          if ($LASTEXITCODE -ne 0) { throw "tauri bundle failed (exit code $LASTEXITCODE)." }
          "MUMCORD_WINDOWS_SIGNED=true" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Portable Windows build (#181): the Mumcord.exe the installer carries, taken out of the
      # installer itself, with the `portable` marker that keeps its data in MumcordData next to
      # it, a short readme and the licences. No single-file portable exe: it could not carry the
      # marker or the licences (docs/windows-portable.md).
      # Not target/release/mumcord.exe: Tauri patches the bundle type into that file, signs it,
      # packs it into the installer and then restores the unpatched, unsigned original. Unpacking
      # the installer (7-Zip reads NSIS installers) gives the exact program users install, and
      # checking its signature proves the installed Mumcord.exe is signed in a signed release.
      - name: Package portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one NSIS installer, found $($setup.Count)" }
          $zip = $setup[0].FullName -replace '-setup\.exe$', '-portable.zip'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip not found: it is needed to unpack the NSIS installer.' }
          $unpacked = "$env:RUNNER_TEMP\installer-contents"
          & $sevenZip x $setup[0].FullName "-o$unpacked" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not unpack the installer (exit code $LASTEXITCODE)." }
          $found = @(Get-ChildItem $unpacked -Recurse -File -Filter Mumcord.exe)
          if ($found.Count -ne 1) { throw "expected one Mumcord.exe in the installer, found $($found.Count)" }
          $exe = $found[0].FullName
          if ($env:MUMCORD_WINDOWS_SIGNED -eq 'true') {
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne 'Valid') { throw "The installer's Mumcord.exe is not signed: $($signature.Status)" }
            Write-Host "The installer's Mumcord.exe is signed by $($signature.SignerCertificate.Subject)."
          }
          $dir = "$env:RUNNER_TEMP\portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe "$dir\Mumcord.exe"
          # ONNX Runtime and the Visual C++ runtime it needs, installed next to Mumcord.exe.
          $dlls = @(Get-ChildItem (Split-Path $exe) -File -Filter *.dll)
          if (-not ($dlls.Name -contains 'onnxruntime.dll')) { throw 'onnxruntime.dll is missing from the installer.' }
          $dlls | Copy-Item -Destination $dir
          New-Item -ItemType File "$dir\portable" | Out-Null
          Copy-Item packaging/windows/README-portable.txt, LICENSE, NOTICE, THIRD_PARTY_NOTICES $dir
          Compress-Archive -Path "$dir\*" -DestinationPath $zip
          Get-Item $zip | Format-Table Name, Length

      # The SBOM job of release.yml runs on another runner and cannot see this host's libraries.
      - name: List bundled native libraries for the SBOM
        if: inputs.release
        shell: bash
        env:
          # Windows links vcpkg's libvpx; the other systems build the version in the script.
          LIBVPX_VERSION: ${{ runner.os == 'Windows' && steps.libvpx.outputs.version || '' }}
        run: scripts/sbom-native.sh "$LIBVPX_VERSION" > "sbom-native-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: sbom-native-${{ matrix.name }}
          path: sbom-native-${{ matrix.name }}.txt
          if-no-files-found: error

      - name: Collect artifact
        shell: bash
        run: |
          mkdir out
          cp ${{ matrix.bundle }} out/
          # The in-app updater swaps the whole app from this archive (issue #168); the release job
          # signs it. COPYFILE_DISABLE keeps macOS metadata files out of the archive.
          if [[ "${{ matrix.name }}" == "macos" && "${{ inputs.release }}" == "true" ]]; then
            COPYFILE_DISABLE=1 tar -czf "out/Mumcord_${{ inputs.version }}_universal.app.tar.gz" \
              -C target/universal-apple-darwin/release/bundle/macos Mumcord.app
          fi
          # Tells the release job to describe the DMG as signed and notarized.
          if [[ "${MUMCORD_MACOS_SIGNED:-}" == "true" ]]; then touch out/MACOS-SIGNED; fi
          if [[ "${MUMCORD_WINDOWS_SIGNED:-}" == "true" ]]; then touch out/WINDOWS-SIGNED; fi
          # Releases carry this note in the release text instead.
          if [[ "${{ inputs.release }}" == "true" ]]; then ls -l out; exit 0; fi
          cat > out/UNSIGNED-TEST-BUILD.txt <<EOF
          Mumcord unsigned test build
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This build is not signed. Windows (SmartScreen) and macOS (Gatekeeper) show a security
          warning on first launch. For testing only; not a release.
          EOF
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: mumcord-${{ matrix.name }}-${{ inputs.release && 'release' || 'unsigned-test-build' }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ inputs.release && 7 || 14 }}

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # mumbot: target of the pinned test bot release (scripts/fetch-mumbot.sh).
          - { name: linux, os: ubuntu-24.04, mumbot: linux-x86_64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, mumbot: linux-aarch64 }
          - { name: windows, os: windows-latest, mumbot: windows-x86_64 }
          - { name: macos, os: macos-latest, mumbot: macos-universal }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: mumcord-${{ matrix.name }}-${{ inputs.release && 'release' || 'unsigned-test-build' }}
          path: build

      # --- Test server -----------------------------------------------------------------------

      # The runner's Ubuntu mirror is often very slow, so the downloaded packages are cached per
      # runner image and only main saves them; PRs restore read-only.
      - name: apt cache key
        id: apt-smoke
        if: runner.os == 'Linux'
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-cache-smoke
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-smoke-${{ matrix.os }}-${{ steps.apt-smoke.outputs.image }}
          restore-keys: apt-smoke-${{ matrix.os }}-

      - name: Start test server (Linux, testenv v15)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          scripts/ci/apt-install.sh --cache-dir "$HOME/apt-archives" \
            libasound2-dev cmake sqlite3 xvfb dbus-x11 gnome-keyring libsecret-tools \
            libwebkit2gtk-4.1-0 libpipewire-0.3-0t64
          # The AppImage must bring its own tray library (it is loaded at runtime, so a missing
          # one only shows on machines without it). Keep it off the runner so the smoke test
          # exercises the bundled copy.
          sudo apt-get purge -y 'libayatana-appindicator3-*' 'libappindicator3-*' || true
          if ldconfig -p | grep -qE 'lib(ayatana-)?appindicator3\.so\.1'; then
            echo "an AppIndicator library is still installed on the runner" >&2; exit 1
          fi
          # Throwaway SuperUser password for this runner only (same as e2e/run.sh).
          printf 'SUPERUSER_PASSWORD=%s\nSERVER_PASSWORD=\n' "$(openssl rand -hex 16)" > testenv/.env
          testenv/up.sh v15

      - name: Clean apt cache
        if: always() && runner.os == 'Linux' && steps.apt-cache-smoke.outputs.cache-hit != 'true'
        run: sudo rm -rf ~/apt-archives/lock ~/apt-archives/partial

      - name: Save apt packages
        if: always() && github.ref == 'refs/heads/main' && runner.os == 'Linux' && steps.apt-cache-smoke.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-smoke-${{ matrix.os }}-${{ steps.apt-smoke.outputs.image }}

      - name: Start test server (Windows, official Mumble server)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = $env:MUMBLE_SERVER_VERSION
          $installer = "$env:RUNNER_TEMP\mumble_server.exe"
          Invoke-WebRequest "https://github.com/mumble-voip/mumble/releases/download/v$v/mumble_server-$v.x64.exe" -OutFile $installer
          # WiX burn bundle: /quiet installs without UI.
          Start-Process $installer -ArgumentList '/quiet', '/norestart' -Wait
          $server = Get-ChildItem 'C:\Program Files\Mumble*' -Recurse -Filter 'mumble-server.exe' | Select-Object -First 1
          if (-not $server) { throw 'mumble-server.exe not found after install' }
          $dir = "$env:RUNNER_TEMP\mumble-server"
          New-Item -ItemType Directory -Force $dir | Out-Null
          # Forward slashes: the ini is parsed by Qt, where a backslash is an escape character.
          $fdir = $dir -replace '\\', '/'
          @"
          database=$fdir/mumble-server.sqlite
          logfile=$fdir/mumble-server.log
          port=64738
          autobanAttempts=0
          "@ | Set-Content "$dir\mumble-server.ini"
          Get-Content "$dir\mumble-server.ini"
          # Started in the smoke step below: runner processes do not survive the end of a step.
          "MUMBLE_SERVER_EXE=$($server.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Homebrew has no Mumble server and the official releases ship none for macOS, so it is
      # built from the release source (server only) and cached. If this fails, the macOS smoke
      # falls back to a start-only check and "connects" stays on the manual checklist.
      - name: Cache Mumble server (macOS)
        if: runner.os == 'macOS'
        id: server-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/mumble-server
          key: mumble-server-${{ env.MUMBLE_SERVER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build Mumble server (macOS)
        id: server-build
        if: runner.os == 'macOS' && steps.server-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          brew install qt@5 protobuf@21 openssl@3 pkgconf
          v=$MUMBLE_SERVER_VERSION
          curl -fsSL "https://github.com/mumble-voip/mumble/releases/download/v$v/mumble-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/mumble-$v" -B "$RUNNER_TEMP/mumble-build" -DCMAKE_BUILD_TYPE=Release \
            -Dclient=OFF -Dserver=ON -Dice=OFF -Dzeroconf=OFF -Dtests=OFF -Dplugins=OFF \
            -Dwarnings-as-errors=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5);$(brew --prefix protobuf@21);$(brew --prefix openssl@3)"
          cmake --build "$RUNNER_TEMP/mumble-build" -j "$(sysctl -n hw.ncpu)"
          mkdir -p ~/mumble-server
          cp "$(find "$RUNNER_TEMP/mumble-build" -type f -perm -u+x -name 'mumble-server' | head -n 1)" ~/mumble-server/

      - name: Save Mumble server (macOS)
        if: runner.os == 'macOS' && steps.server-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && steps.server-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/mumble-server
          key: ${{ steps.server-cache.outputs.cache-primary-key }}

      - name: Start test server (macOS)
        if: runner.os == 'macOS'
        id: mac-server
        continue-on-error: true
        run: |
          test -x ~/mumble-server/mumble-server
          # Runtime libraries of the cached binary.
          brew install qt@5 protobuf@21 openssl@3
          dir=$RUNNER_TEMP/mumble-server-data
          mkdir -p "$dir"
          printf 'database=%s\nport=64738\nautobanAttempts=0\n' "$dir/mumble-server.sqlite" > "$dir/mumble-server.ini"
          ~/mumble-server/mumble-server -ini "$dir/mumble-server.ini" -fg > "$dir/server.log" 2>&1 &
          for _ in $(seq 60); do nc -z 127.0.0.1 64738 && exit 0; sleep 1; done
          cat "$dir/server.log"
          exit 1

      # --- Smoke helpers ---------------------------------------------------------------------

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            scripts/smoke/seed -> target

      - name: Build seeder
        run: CARGO_TARGET_DIR="$PWD/target" cargo build --release --locked --manifest-path scripts/smoke/seed/Cargo.toml

      # The archive name carries the version, so a bump in scripts/mumbot.env misses the cache.
      - id: mumbot-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/mumbot
          key: mumbot-${{ matrix.mumbot }}-${{ hashFiles('scripts/mumbot.env') }}

      - name: Fetch mumbot
        run: scripts/fetch-mumbot.sh ${{ matrix.mumbot }} "$RUNNER_TEMP/mumbot"

      - if: steps.mumbot-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/mumbot
          key: ${{ steps.mumbot-cache.outputs.cache-primary-key }}

      # --- Install the build and run the smoke test ------------------------------------------

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          # No FUSE needed on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(ls build/*.AppImage)
          chmod +x "$app"
          # The tray library is loaded with dlopen, so the bundler's dependency scan cannot be
          # trusted to have picked it up: check the AppImage contents directly.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$app" --appimage-extract >/dev/null)
          test -e "$RUNNER_TEMP/squashfs-root/usr/lib/libayatana-appindicator3.so.1" \
            || { echo "libayatana-appindicator3.so.1 is missing from the AppImage" >&2; exit 1; }
          for f in libgstlibav.so libavcodec.so.* libx264.so.*; do
            if compgen -G "$RUNNER_TEMP/squashfs-root/usr/lib/$f" >/dev/null \
              || compgen -G "$RUNNER_TEMP/squashfs-root/usr/lib/gstreamer-1.0/$f" >/dev/null; then
              echo "$f must not be bundled in the AppImage" >&2; exit 1
            fi
          done
          # Without the Opus parser YouTube refuses to play in the AppImage (scripts/filter-gst-plugins.sh).
          test -e "$RUNNER_TEMP/squashfs-root/usr/lib/gstreamer-1.0/libgstopusparse.so" \
            || { echo "libgstopusparse.so is missing from the AppImage" >&2; exit 1; }
          # Without the bundled scanner every plugin load warns and runs in-process.
          test -x "$RUNNER_TEMP/squashfs-root/usr/lib/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner" \
            || { echo "gst-plugin-scanner is missing from the AppImage" >&2; exit 1; }
          # Camera background effects: the bundled ONNX Runtime loads from where
          # crates/effects/src/runtime.rs looks for it (usr/lib/mumcord beside usr/bin).
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/mumcord" \
            || { echo "usr/bin/mumcord is missing from the AppImage" >&2; exit 1; }
          python3 -I scripts/smoke/check-onnxruntime.py "$RUNNER_TEMP/squashfs-root/usr/lib/mumcord/libonnxruntime.so.1.23.2"
          rm -rf "$RUNNER_TEMP/squashfs-root"
          # Secret Service (unlocked gnome-keyring) for the identity, and a virtual display.
          # An EMPTY password creates no `login` collection, so unlock with a fixed non-empty
          # throwaway password in a fresh D-Bus session; verify with secret-tool before seeding.
          # shellcheck disable=SC2016 # the script is expanded by the inner bash in the D-Bus session
          dbus-run-session -- bash -c '
            set -e
            printf "smoke" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            gnome-keyring-daemon --start --components=secrets >/dev/null
            printf "probe" | secret-tool store --label=smoke-probe app mumcord-smoke
            test "$(secret-tool lookup app mumcord-smoke)" = probe
            secret-tool clear app mumcord-smoke
            xvfb-run -a scripts/smoke/smoke.sh --app "$0" --seed target/release/mumcord-smoke-seed --bot "$1"
          ' "$PWD/$app" "$RUNNER_TEMP/mumbot/mumbot"
          # The app runs without a tray when the library cannot be loaded; in the AppImage that
          # means the bundled copy is broken (e.g. a dependency of it is missing).
          logs="${XDG_DATA_HOME:-$HOME/.local/share}/app.mumcord.client/logs"
          if grep -qs 'no tray library' "$logs"/*; then
            echo "the AppImage could not load its bundled tray library" >&2; exit 1
          fi

      # The smoke test ran the AppImage; the .deb and .rpm carry the same binary, so check that
      # each installs on its distribution with every shared library resolved and the menu entry
      # (with the mumble:// handler), the in-game overlay layer and ONNX Runtime in place. Tauri does not scan
      # the binary for its libraries, so a missing package dependency only shows here.
      - name: Check .deb and .rpm packages
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016 # the script is expanded later, by the shell that runs it
          check='
            set -e
            missing=$(ldd /usr/bin/mumcord | grep "=> not found" || true)
            if [ -n "$missing" ]; then echo "unresolved libraries: $missing" >&2; exit 1; fi
            test -e /usr/lib/mumcord/libmumcord_overlay_layer.so
            missing=$(ldd /usr/lib/mumcord/libonnxruntime.so.1.23.2 | grep "=> not found" || true)
            if [ -n "$missing" ]; then echo "ONNX Runtime: unresolved libraries: $missing" >&2; exit 1; fi
            grep -qx "MimeType=x-scheme-handler/mumble;" /usr/share/applications/Mumcord.desktop
            grep -qx "StartupWMClass=app.mumcord.client" /usr/share/applications/Mumcord.desktop
            test -e /usr/share/icons/hicolor/128x128/apps/mumcord.png
          '
          sudo apt-get install -y --no-install-recommends "$PWD/$(ls build/*.deb)"
          bash -c "$check"
          python3 -I scripts/smoke/check-onnxruntime.py /usr/lib/mumcord/libonnxruntime.so.1.23.2
          docker run --rm -v "$PWD/build:/build:ro" fedora:42 bash -c \
            "dnf install -y -q /build/*.rpm >/dev/null && $check"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          # Keep Git Bash from rewriting "/S" and the mumble:// link into Windows paths.
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          installer=$(ls build/*-setup.exe)
          # NSIS silent install for the current user.
          "$installer" /S
          app=$(find "$(cygpath -u "$LOCALAPPDATA")" -maxdepth 3 -iname 'mumcord.exe' | head -n 1)
          test -n "$app" || { echo "Mumcord.exe not found after install" >&2; exit 1; }
          # Camera background effects: ONNX Runtime next to Mumcord.exe, with the Visual C++
          # runtime DLLs it links (the runner has the redistributable installed system-wide, so
          # only their presence shows that users without it can load the library). Microsoft
          # signs onnxruntime.dll and the runtime DLLs; Tauri keeps signed files as they are.
          check_onnxruntime() {
            local dir=$1 dll
            for dll in onnxruntime.dll vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll; do
              test -f "$dir/$dll" || { echo "$dll is missing next to Mumcord.exe in $dir" >&2; return 1; }
            done
            powershell -NoProfile -Command "\$s = Get-AuthenticodeSignature '$(cygpath -w "$dir/onnxruntime.dll")'; if (\$s.Status -ne 'Valid') { Write-Error \"onnxruntime.dll signature: \$(\$s.Status)\"; exit 1 }; Write-Host \"onnxruntime.dll is signed by \$(\$s.SignerCertificate.Subject)\"" || return 1
            python -I scripts/smoke/check-onnxruntime.py "$(cygpath -w "$dir/onnxruntime.dll")"
          }
          check_onnxruntime "$(dirname "$app")"
          dir=$(cygpath -w "$RUNNER_TEMP")\\mumble-server
          dump() { powershell -NoProfile -File scripts/smoke/dump-win-server.ps1 "$dir" || true; }
          # Same step as the smoke run, so the server process stays alive for it.
          powershell -NoProfile -File scripts/smoke/start-win-server.ps1 "$MUMBLE_SERVER_EXE" "$dir" || { dump; exit 1; }
          powershell -NoProfile -Command "if (-not (Get-Process -Id (Get-Content '$dir\\server.pid') -ErrorAction SilentlyContinue)) { exit 1 }" \
            || { echo "server process is gone before seeding" >&2; dump; exit 1; }
          scripts/smoke/smoke.sh --app "$app" --seed target/release/mumcord-smoke-seed.exe --bot "$RUNNER_TEMP/mumbot/mumbot.exe" || { dump; exit 1; }
          # Portable zip (#181): the same test from an unpacked folder with the marker. The
          # installed app's profile goes first, so anything the portable app writes to the
          # profile folders shows up.
          appdata=$(cygpath -u "$APPDATA")/app.mumcord.client
          localdata=$(cygpath -u "$LOCALAPPDATA")/app.mumcord.client
          # The web view's helper processes outlive the killed app for a moment and keep its
          # profile files open.
          taskkill /F /IM msedgewebview2.exe >/dev/null 2>&1 || true
          for _ in {1..30}; do
            rm -rf "$appdata" "$localdata" 2>/dev/null && break
            sleep 1
          done
          rm -rf "$appdata" "$localdata"
          portable="$RUNNER_TEMP/mumcord-portable"
          powershell -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "$(ls build/*-portable.zip)")' -DestinationPath '$(cygpath -w "$portable")'"
          ls -l "$portable"
          test -f "$portable/portable" || { echo "the portable marker is missing from the zip" >&2; exit 1; }
          check_onnxruntime "$portable"
          scripts/smoke/smoke.sh --portable --app "$portable/Mumcord.exe" --seed target/release/mumcord-smoke-seed.exe --bot "$RUNNER_TEMP/mumbot/mumbot.exe" || { dump; exit 1; }
          test -d "$portable/MumcordData/local/EBWebView" || { echo "no web view data in MumcordData" >&2; exit 1; }
          [[ -n $(ls -A "$portable/MumcordData/logs" 2>/dev/null) ]] || { echo "no logs in MumcordData" >&2; exit 1; }
          for dir in "$appdata" "$localdata"; do
            if [[ -e $dir ]]; then
              echo "portable mode wrote to $dir:" >&2
              find "$dir" -maxdepth 2 >&2
              exit 1
            fi
          done
          echo "== portable data stayed in MumcordData"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls build/*.dmg)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}')
          cp -R "$mount/Mumcord.app" /Applications/
          hdiutil detach "$mount"
          # Camera background effects: ONNX Runtime for both architectures in the app's
          # Frameworks, signed with the app (Developer ID in a signed build, ad hoc otherwise).
          ort=/Applications/Mumcord.app/Contents/Frameworks/libonnxruntime.1.23.2.dylib
          for arch in arm64 x86_64; do
            lipo "$ort" -verify_arch "$arch" || { echo "ONNX Runtime has no $arch slice" >&2; exit 1; }
          done
          codesign --verify --strict --verbose=2 "$ort"
          if [[ -e build/MACOS-SIGNED ]]; then
            team() { codesign -dv "$1" 2>&1 | grep '^TeamIdentifier='; }
            [[ -n "$(team "$ort")" && "$(team "$ort")" == "$(team /Applications/Mumcord.app)" ]] \
              || { echo "ONNX Runtime is not signed by the app's team" >&2; exit 1; }
          fi
          python3 -I scripts/smoke/check-onnxruntime.py "$ort"
          if [[ "${{ steps.mac-server.outcome }}" == "success" ]]; then
            scripts/smoke/smoke.sh --app /Applications/Mumcord.app --seed target/release/mumcord-smoke-seed --bot "$RUNNER_TEMP/mumbot/mumbot"
          else
            echo "::warning::No Mumble server on macOS – start-only check; 'connects' is a manual checklist item (AC-1.30)."
            scripts/smoke/smoke.sh --app /Applications/Mumcord.app --start-only
          fi
