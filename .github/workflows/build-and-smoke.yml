name: Build and smoke

# Reusable: builds the unsigned bundles (Linux AppImage, Windows NSIS installer, macOS universal
# DMG), uploads them as workflow artifacts, then installs each one on a fresh runner and
# smoke-tests it against a local Mumble server (scripts/smoke/smoke.sh). Called by
# test-builds.yml (spec §10, AC-1.30) and release.yml (QA.12). Test builds are never signed.
# Release builds sign and notarize the macOS DMG only when the Apple secrets exist, and sign the
# Windows app and installer through Azure Artifact Signing only when the Azure variables exist
# (docs/release-signing.md); without them those bundles are built unsigned.
on:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_P8:
        required: false
    inputs:
      release:
        description: Build for a tagged release instead of a test build.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Official Mumble server for the native Windows/macOS smoke servers (Linux uses testenv).
  MUMBLE_SERVER_VERSION: 1.5.939

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            args: --bundles appimage
            bundle: target/release/bundle/appimage/*.AppImage
          - name: windows
            os: windows-latest
            args: --bundles nsis
            bundle: target/release/bundle/nsis/*-setup.exe
          # One DMG for Apple Silicon and Intel Macs. The smoke test on the arm64 runner
          # exercises the arm64 half.
          - name: macos
            os: macos-latest
            args: --bundles dmg --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The Azure federated credential trusts only jobs in the "release" environment (OIDC).
    environment: ${{ (inputs.release && matrix.name == 'windows') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libasound2-dev cmake patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Tauri imports the certificate into a temporary keychain, signs with the hardened runtime
      # and entitlements, then notarizes and staples. All of that is switched on by these env vars.
      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS' && inputs.release
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::Apple secret $v is not set: building the macOS DMG unsigned."
              exit 0
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
            echo "MUMCORD_MACOS_SIGNED=true"
          } >> "$GITHUB_ENV"

      - name: Check Windows signing setup
        id: azure
        if: runner.os == 'Windows' && inputs.release
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::Repository variable $v is not set: building the Windows installer unsigned."
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        if: steps.azure.outputs.enabled != 'true'
        run: npm run tauri build -- ${{ matrix.args }}

      # Signed Windows release: Tauri signs the app exe, the uninstaller and the installer with
      # signtool and Microsoft's Artifact Signing plugin, so the installer contains the signed
      # exe. The signCommand lives only in this CI overlay, never in tauri.conf.json, so local
      # builds stay unsigned. The app is compiled before the Azure login because the login's
      # GitHub token is short-lived and must still be valid when the first file is signed.
      - name: Build Windows app for signing
        if: steps.azure.outputs.enabled == 'true'
        run: npm run tauri build -- --no-bundle

      - name: Prepare Artifact Signing
        if: steps.azure.outputs.enabled == 'true'
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        run: |
          # Pinned NuGet packages: signtool from the Windows SDK build tools and the Artifact
          # Signing plugin it loads (runs on the .NET 8 runtime that ships with the runner).
          $dir = "$env:RUNNER_TEMP\artifact-signing"
          $packages = @{
            'microsoft.windows.sdk.buildtools' = '10.0.28000.2705'
            'microsoft.artifactsigning.client' = '1.0.146'
          }
          foreach ($name in $packages.Keys) {
            $version = $packages[$name]
            $nupkg = "$dir\$name.zip"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$name/$version/$name.$version.nupkg" -OutFile $nupkg
            Expand-Archive $nupkg -DestinationPath "$dir\$name"
          }
          $signtool = "$dir\microsoft.windows.sdk.buildtools\bin\10.0.28000.0\x64\signtool.exe"
          $dlib = "$dir\microsoft.artifactsigning.client\bin\x64\Azure.CodeSigning.Dlib.dll"
          foreach ($file in $signtool, $dlib) {
            if (-not (Test-Path $file)) { throw "$file not found in the downloaded package" }
          }
          # Only the Azure CLI login from the next step may authenticate.
          $metadata = "$dir\metadata.json"
          @{
            Endpoint               = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_CERT_PROFILE
            CorrelationId          = "${{ github.repository }}/${{ github.run_id }}"
            ExcludeCredentials     = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata
          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd  = $signtool
                  args = @(
                    'sign', '/v', '/fd', 'SHA256',
                    '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                    '/d', 'Mumcord',
                    '/dlib', $dlib, '/dmdf', $metadata,
                    '%1'
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$dir\tauri.signing.json"
          "MUMCORD_SIGNING_CONFIG=$dir\tauri.signing.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # OpenID Connect: GitHub vouches for this workflow run, so no Azure secret is stored.
      - name: Log in to Azure
        if: steps.azure.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bundle and sign Windows installer
        if: steps.azure.outputs.enabled == 'true'
        shell: bash
        run: |
          npm run tauri bundle -- --bundles nsis --config "$MUMCORD_SIGNING_CONFIG"
          echo "MUMCORD_WINDOWS_SIGNED=true" >> "$GITHUB_ENV"

      - name: Collect artifact
        shell: bash
        run: |
          mkdir out
          cp ${{ matrix.bundle }} out/
          # Tells the release job to describe the DMG as signed and notarized.
          if [[ "${MUMCORD_MACOS_SIGNED:-}" == "true" ]]; then touch out/MACOS-SIGNED; fi
          if [[ "${MUMCORD_WINDOWS_SIGNED:-}" == "true" ]]; then touch out/WINDOWS-SIGNED; fi
          # Releases carry this note in the release text instead.
          if [[ "${{ inputs.release }}" == "true" ]]; then ls -l out; exit 0; fi
          cat > out/UNSIGNED-TEST-BUILD.txt <<EOF
          Mumcord unsigned test build
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This build is not signed. Windows (SmartScreen) and macOS (Gatekeeper) show a security
          warning on first launch. For testing only; not a release.
          EOF
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: mumcord-${{ matrix.name }}-${{ inputs.release && 'release' || 'unsigned-test-build' }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ inputs.release && 7 || 14 }}

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mumcord-${{ matrix.name }}-${{ inputs.release && 'release' || 'unsigned-test-build' }}
          path: build

      # --- Test server -----------------------------------------------------------------------

      - name: Start test server (Linux, testenv v15)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev cmake sqlite3 xvfb dbus-x11 gnome-keyring libsecret-tools \
            libwebkit2gtk-4.1-0
          # The AppImage must bring its own tray library (it is loaded at runtime, so a missing
          # one only shows on machines without it). Keep it off the runner so the smoke test
          # exercises the bundled copy.
          sudo apt-get purge -y 'libayatana-appindicator3-*' 'libappindicator3-*' || true
          if ldconfig -p | grep -qE 'lib(ayatana-)?appindicator3\.so\.1'; then
            echo "an AppIndicator library is still installed on the runner" >&2; exit 1
          fi
          # Throwaway SuperUser password for this runner only (same as e2e/run.sh).
          printf 'SUPERUSER_PASSWORD=%s\nSERVER_PASSWORD=\n' "$(openssl rand -hex 16)" > testenv/.env
          testenv/up.sh v15

      - name: Start test server (Windows, official Mumble server)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = $env:MUMBLE_SERVER_VERSION
          $installer = "$env:RUNNER_TEMP\mumble_server.exe"
          Invoke-WebRequest "https://github.com/mumble-voip/mumble/releases/download/v$v/mumble_server-$v.x64.exe" -OutFile $installer
          # WiX burn bundle: /quiet installs without UI.
          Start-Process $installer -ArgumentList '/quiet', '/norestart' -Wait
          $server = Get-ChildItem 'C:\Program Files\Mumble*' -Recurse -Filter 'mumble-server.exe' | Select-Object -First 1
          if (-not $server) { throw 'mumble-server.exe not found after install' }
          $dir = "$env:RUNNER_TEMP\mumble-server"
          New-Item -ItemType Directory -Force $dir | Out-Null
          # Forward slashes: the ini is parsed by Qt, where a backslash is an escape character.
          $fdir = $dir -replace '\\', '/'
          @"
          database=$fdir/mumble-server.sqlite
          logfile=$fdir/mumble-server.log
          port=64738
          autobanAttempts=0
          "@ | Set-Content "$dir\mumble-server.ini"
          Get-Content "$dir\mumble-server.ini"
          # Started in the smoke step below: runner processes do not survive the end of a step.
          "MUMBLE_SERVER_EXE=$($server.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Homebrew has no Mumble server and the official releases ship none for macOS, so it is
      # built from the release source (server only) and cached. If this fails, the macOS smoke
      # falls back to a start-only check and "connects" stays on the manual checklist.
      - name: Cache Mumble server (macOS)
        if: runner.os == 'macOS'
        id: server-cache
        uses: actions/cache@v4
        with:
          path: ~/mumble-server
          key: mumble-server-${{ env.MUMBLE_SERVER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build Mumble server (macOS)
        if: runner.os == 'macOS' && steps.server-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          brew install qt@5 protobuf@21 openssl@3 pkgconf
          v=$MUMBLE_SERVER_VERSION
          curl -fsSL "https://github.com/mumble-voip/mumble/releases/download/v$v/mumble-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/mumble-$v" -B "$RUNNER_TEMP/mumble-build" -DCMAKE_BUILD_TYPE=Release \
            -Dclient=OFF -Dserver=ON -Dice=OFF -Dzeroconf=OFF -Dtests=OFF -Dplugins=OFF \
            -Dwarnings-as-errors=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5);$(brew --prefix protobuf@21);$(brew --prefix openssl@3)"
          cmake --build "$RUNNER_TEMP/mumble-build" -j "$(sysctl -n hw.ncpu)"
          mkdir -p ~/mumble-server
          cp "$(find "$RUNNER_TEMP/mumble-build" -type f -perm -u+x -name 'mumble-server' | head -n 1)" ~/mumble-server/

      - name: Start test server (macOS)
        if: runner.os == 'macOS'
        id: mac-server
        continue-on-error: true
        run: |
          test -x ~/mumble-server/mumble-server
          # Runtime libraries of the cached binary.
          brew install qt@5 protobuf@21 openssl@3
          dir=$RUNNER_TEMP/mumble-server-data
          mkdir -p "$dir"
          printf 'database=%s\nport=64738\nautobanAttempts=0\n' "$dir/mumble-server.sqlite" > "$dir/mumble-server.ini"
          ~/mumble-server/mumble-server -ini "$dir/mumble-server.ini" -fg > "$dir/server.log" 2>&1 &
          for i in $(seq 60); do nc -z 127.0.0.1 64738 && exit 0; sleep 1; done
          cat "$dir/server.log"
          exit 1

      # --- Smoke helpers ---------------------------------------------------------------------

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke
          workspaces: |
            . -> target
            scripts/smoke/seed -> target

      - name: Build seeder and mumcord-bot
        run: |
          cargo build --release --locked -p mumcord-bot
          CARGO_TARGET_DIR="$PWD/target" cargo build --release --locked --manifest-path scripts/smoke/seed/Cargo.toml

      # --- Install the build and run the smoke test ------------------------------------------

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          # No FUSE needed on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(ls build/*.AppImage)
          chmod +x "$app"
          # The tray library is loaded with dlopen, so the bundler's dependency scan cannot be
          # trusted to have picked it up: check the AppImage contents directly.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$app" --appimage-extract >/dev/null)
          test -e "$RUNNER_TEMP/squashfs-root/usr/lib/libayatana-appindicator3.so.1" \
            || { echo "libayatana-appindicator3.so.1 is missing from the AppImage" >&2; exit 1; }
          rm -rf "$RUNNER_TEMP/squashfs-root"
          # Secret Service (unlocked gnome-keyring) for the identity, and a virtual display.
          # An EMPTY password creates no `login` collection, so unlock with a fixed non-empty
          # throwaway password in a fresh D-Bus session; verify with secret-tool before seeding.
          dbus-run-session -- bash -c '
            set -e
            printf "smoke" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            gnome-keyring-daemon --start --components=secrets >/dev/null
            printf "probe" | secret-tool store --label=smoke-probe app mumcord-smoke
            test "$(secret-tool lookup app mumcord-smoke)" = probe
            secret-tool clear app mumcord-smoke
            xvfb-run -a scripts/smoke/smoke.sh --app "$0" --seed target/release/mumcord-smoke-seed --bot target/release/mumcord-bot
          ' "$PWD/$app"
          # The app runs without a tray when the library cannot be loaded; in the AppImage that
          # means the bundled copy is broken (e.g. a dependency of it is missing).
          logs="${XDG_DATA_HOME:-$HOME/.local/share}/app.mumcord.client/logs"
          if grep -qs 'no tray library' "$logs"/*; then
            echo "the AppImage could not load its bundled tray library" >&2; exit 1
          fi

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          # Keep Git Bash from rewriting "/S" and the mumble:// link into Windows paths.
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          installer=$(ls build/*-setup.exe)
          # NSIS silent install for the current user.
          "$installer" /S
          app=$(find "$(cygpath -u "$LOCALAPPDATA")" -maxdepth 3 -iname 'mumcord.exe' | head -n 1)
          test -n "$app" || { echo "Mumcord.exe not found after install" >&2; exit 1; }
          dir=$(cygpath -w "$RUNNER_TEMP")\\mumble-server
          dump() { powershell -NoProfile -File scripts/smoke/dump-win-server.ps1 "$dir" || true; }
          # Same step as the smoke run, so the server process stays alive for it.
          powershell -NoProfile -File scripts/smoke/start-win-server.ps1 "$MUMBLE_SERVER_EXE" "$dir" || { dump; exit 1; }
          powershell -NoProfile -Command "if (-not (Get-Process -Id (Get-Content '$dir\\server.pid') -ErrorAction SilentlyContinue)) { exit 1 }" \
            || { echo "server process is gone before seeding" >&2; dump; exit 1; }
          scripts/smoke/smoke.sh --app "$app" --seed target/release/mumcord-smoke-seed.exe --bot target/release/mumcord-bot.exe || { dump; exit 1; }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls build/*.dmg)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}')
          cp -R "$mount/Mumcord.app" /Applications/
          hdiutil detach "$mount"
          if [[ "${{ steps.mac-server.outcome }}" == "success" ]]; then
            scripts/smoke/smoke.sh --app /Applications/Mumcord.app --seed target/release/mumcord-smoke-seed --bot target/release/mumcord-bot
          else
            echo "::warning::No Mumble server on macOS – start-only check; 'connects' is a manual checklist item (AC-1.30)."
            scripts/smoke/smoke.sh --app /Applications/Mumcord.app --start-only
          fi
