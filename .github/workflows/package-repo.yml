name: Package repository

# Publishes the newest stable release to the signed package repository at
# https://packages.mumcord.app (issue #620): APT (Debian, Ubuntu, Mint), RPM (Fedora, openSUSE),
# pacman (Arch) and FreeBSD pkg. The site is GitHub Pages of this repository, so there is no
# server to run. See CODE_SIGNING.md for the keys and RELEASING.md for the release steps.
#
# Each run rebuilds the whole site from one release's assets (checked against its SHA256SUMS):
# the repository holds only the newest version, so it needs no state and stays well below the
# Pages size limit. Before anything goes live, every format is checked the way users' systems
# use it, in fresh containers and a FreeBSD VM: an index or package changed after signing is
# rejected, and Mumcord installs from the real repository with the published config files.
#
# A published stable release starts the workflow on main (dispatch), because the github-pages
# environment only deploys from main and the scripts must come from main, not from the tag.
# A pull request that changes the repository scripts, and a run on another branch, build and
# check the latest release but do not deploy. Without the signing secrets (PACKAGE_REPO_GPG_KEY,
# FREEBSD_REPO_KEY, so also in pull requests from forks) it skips with a notice.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/package-repo.yml
      - scripts/package-repo/**
      - packaging/repo/**
      - packaging/aur/PKGBUILD
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.9.1 (empty: the latest stable release)"
        required: false
        type: string

concurrency:
  group: package-repo-${{ github.event_name }}-${{ github.ref }}
  # A newer push to a pull request replaces its check; a publish run is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dispatch:
    name: Start on main
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Starts this workflow on main.
      actions: write
    steps:
      - name: Start the publish run on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run package-repo.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  prepare:
    name: Pick release
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      skip: ${{ steps.keys.outputs.skip }}
    steps:
      - name: Check signing secrets
        id: keys
        env:
          PACKAGE_REPO_GPG_KEY: ${{ secrets.PACKAGE_REPO_GPG_KEY }}
          FREEBSD_REPO_KEY: ${{ secrets.FREEBSD_REPO_KEY }}
        run: |
          if [[ -z "$PACKAGE_REPO_GPG_KEY" || -z "$FREEBSD_REPO_KEY" ]]; then
            echo "::notice::PACKAGE_REPO_GPG_KEY or FREEBSD_REPO_KEY is not set; skipping the package repository."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # "Latest" on GitHub is never a draft or a pre-release.
          tag=${TAG_INPUT:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          version=${tag#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a stable release tag like v1.2.3."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build APT, RPM and pacman repositories
    needs: prepare
    if: ${{ needs.prepare.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and check the release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir pkgs && cd pkgs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS \
            --pattern "Mumcord_${VERSION}_amd64.deb" --pattern "Mumcord_${VERSION}_arm64.deb" \
            --pattern "Mumcord-${VERSION}-1.x86_64.rpm" --pattern "Mumcord-${VERSION}-1.aarch64.rpm"
          grep -E ' \*?Mumcord[-_].*\.(deb|rpm)$' SHA256SUMS > checked
          [[ $(wc -l < checked) -eq 4 ]] || { echo "::error::SHA256SUMS does not list the four packages."; exit 1; }
          sha256sum -c checked

      - name: Install tools
        run: scripts/ci/apt-install.sh apt-utils createrepo-c rpm

      - name: Build and sign
        env:
          PACKAGE_REPO_GPG_KEY: ${{ secrets.PACKAGE_REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          fpr=$(scripts/package-repo/import-key.sh)
          scripts/package-repo/build-apt.sh "$fpr" "$VERSION" pkgs site
          scripts/package-repo/build-rpm.sh "$fpr" "$VERSION" pkgs site
          # makepkg and repo-add come from Arch; the key goes in through the mounted GNUPGHOME.
          docker run --rm -v "$PWD:/src" -v "$GNUPGHOME:/gnupg" -e GNUPGHOME=/gnupg \
            -e FPR="$fpr" -e VERSION="$VERSION" archlinux:latest bash -c '
              set -euo pipefail
              trap "chown -R $(stat -c %u:%g /src) /src/site /gnupg" EXIT
              pacman -Sy --noconfirm --needed fakeroot >/dev/null
              /src/scripts/package-repo/build-pacman.sh "$FPR" "$VERSION" /src/pkgs /src/site'
          rm -rf "$GNUPGHOME"
          cp packaging/repo/mumcord.{asc,sources,repo,conf,pub} site/
          du -sh site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-repo-linux
          path: site/
          if-no-files-found: error
          retention-days: 3

  freebsd:
    name: Build and check FreeBSD repository
    needs: prepare
    if: ${{ needs.prepare.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and check the release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir pkgs && cd pkgs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS \
            --pattern "mumcord-${VERSION}.pkg"
          grep -E " \*?mumcord-${VERSION//./\\.}\.pkg$" SHA256SUMS > checked
          sha256sum -c checked

      - name: Build and check in a FreeBSD VM
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        env:
          FREEBSD_REPO_KEY: ${{ secrets.FREEBSD_REPO_KEY }}
        with:
          release: "15.1"
          usesh: true
          # vmactions forwards only GITHUB_*, CI, and the names listed here.
          envs: FREEBSD_REPO_KEY VERSION
          run: |
            set -eu
            key=$(mktemp)
            printf '%s\n' "$FREEBSD_REPO_KEY" > "$key"
            # A wrong or rotated secret must not sign a catalogue users' pinned key would reject.
            openssl rsa -in "$key" -pubout 2>/dev/null | cmp -s - packaging/repo/mumcord.pub || {
              echo "::error::FREEBSD_REPO_KEY does not match packaging/repo/mumcord.pub."
              rm -f "$key"
              exit 1
            }
            sh scripts/package-repo/build-freebsd.sh "$VERSION" pkgs site "$key"
            rm -f "$key"
            sh scripts/package-repo/verify-freebsd.sh "$PWD/site"

      # Artifacts refuse file names with a colon, and pkg's ABI folder is FreeBSD:15:amd64, so
      # the FreeBSD part travels as one tar file.
      - name: Pack the FreeBSD repository
        run: tar -cf freebsd-repo.tar -C site freebsd

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-repo-freebsd
          path: freebsd-repo.tar
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Check ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:13", family: apt }
          - { image: "ubuntu:24.04", family: apt }
          - { image: "fedora:43", family: dnf }
          - { image: "opensuse/tumbleweed", family: zypper }
          - { image: "opensuse/leap:15.6", family: zypper }
          - { image: "archlinux:latest", family: pacman }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-repo-linux
          path: site

      - name: Serve the repository and two tampered copies
        run: |
          set -euo pipefail
          scripts/package-repo/tamper.sh site bad-meta bad-pkg
          python3 -m http.server 8780 -b 127.0.0.1 -d site >/dev/null 2>&1 &
          python3 -m http.server 8781 -b 127.0.0.1 -d bad-meta >/dev/null 2>&1 &
          python3 -m http.server 8782 -b 127.0.0.1 -d bad-pkg >/dev/null 2>&1 &
          for port in 8780 8781 8782; do
            timeout 10 bash -c "until curl -fsS -o /dev/null http://127.0.0.1:$port/mumcord.asc; do sleep 0.2; done"
          done

      - name: Install from the repository
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
        run: |
          docker run --rm --network host -v "$PWD/scripts/package-repo:/v:ro" \
            -v "$PWD/packaging/repo:/cfg:ro" "$IMAGE" /v/verify.sh "$FAMILY"

  deploy:
    name: Publish to packages.mumcord.app
    needs: [prepare, linux, freebsd, verify]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-repo-linux
          path: site

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-repo-freebsd

      - name: Add the FreeBSD repository
        run: |
          tar -xf freebsd-repo.tar -C site
          rm freebsd-repo.tar
          du -sh site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
