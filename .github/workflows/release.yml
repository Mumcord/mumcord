name: Release

# Release builds from version tags on main (decision QA.12). Pushing `vX.Y.Z` checks that the
# tag is a version and points to a commit on main, sets that version in all manifests of each
# build (scripts/set-version.sh), builds and smoke-tests the bundles (build-and-smoke.yml), and
# creates a DRAFT GitHub Release with the bundles, one SBOM per bundle type and SHA256SUMS. The
# maintainer reviews and publishes it by hand. See RELEASING.md.
on:
  push:
    tags: ["v*"]

# Never build the same tag twice at once; never cancel a running release build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Check tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0

      # The manifests in the repository are not bumped for a release: every job that builds or
      # publishes sets this version first (scripts/set-version.sh, RELEASING.md).
      - name: Check tag is a version on main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || fail "Tag '$TAG' is not a version tag like v1.2.3."
          version=${TAG#v}

          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main \
            || fail "Tag '$TAG' points to $commit, which is not on main. Tag a commit on main."

          echo "Tag $TAG is a version on main."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails here, before any build, when the script cannot set this version.
      - name: Dry run of the version step
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

  # Regenerates the third-party notices from the tagged commit, so the About page of every bundle
  # lists exactly the dependencies it ships; the build jobs bundle this artifact. It also enforces
  # the licence policy (scripts/generate-notices.sh) before anything is built.
  notices:
    name: Generate third-party notices
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tools
        run: grep '^[A-Z_]*=' scripts/license-tools.env >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cargo-tool
        with:
          crate: cargo-about
          version: ${{ steps.tools.outputs.CARGO_ABOUT_VERSION }}
          features: cli

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate notices
        run: scripts/generate-notices.sh

      - uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: |
            THIRD_PARTY_NOTICES
            ui/public/third-party-notices.txt
          if-no-files-found: error

  build:
    needs: [guard, notices]
    uses: ./.github/workflows/build-and-smoke.yml
    with:
      release: true
      version: ${{ needs.guard.outputs.version }}
    # Passes the optional Apple signing secrets; id-token lets the Windows job log in to Azure
    # for Artifact Signing without a stored secret (docs/release-signing.md).
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # One CycloneDX SBOM per bundle type (scripts/generate-sbom.sh), from the tagged commit and the
  # native libraries each build job recorded (scripts/sbom-native.sh).
  sbom:
    name: Generate SBOMs
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tools
        run: grep '^[A-Z_]*=' scripts/license-tools.env >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cargo-tool
        with:
          crate: cargo-cyclonedx
          version: ${{ steps.tools.outputs.CARGO_CYCLONEDX_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-native-*
          path: native
          merge-multiple: true

      # The manifests carry no release version; set the tag's, as the builds do, so the SBOMs
      # list Mumcord's own crates and packages with it.
      - name: Set version
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - name: Generate SBOMs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/generate-sbom.sh "$VERSION" native sbom

      - uses: actions/upload-artifact@v7
        with:
          name: mumcord-sbom
          path: sbom/
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [guard, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance attestation of the release files.
      id-token: write
      attestations: write
    steps:
      # Only for the curl installer, which is published with each release (FR-2.54).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: mumcord-*-release
          path: dist
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          name: mumcord-sbom
          path: dist

      - name: Write checksums and release notes
        working-directory: dist
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # Fails if any bundle is missing; Linux has three packages for each of two CPUs.
          linux=(*_amd64.AppImage *_aarch64.AppImage *_amd64.deb *_arm64.deb *.x86_64.rpm *.aarch64.rpm)
          ls -l -- "${linux[@]}" *-setup.exe *.dmg *.cdx.json
          cp ../scripts/install.sh .
          sha256sum -- "${linux[@]}" *-setup.exe *.dmg *.cdx.json install.sh > SHA256SUMS
          cat SHA256SUMS
          # A warning box as soon as one platform is unsigned, a plain note otherwise.
          callout=NOTE
          if [[ -f WINDOWS-SIGNED ]]; then
            windows_note="Windows: the app and installer are signed (see the [code signing policy](https://github.com/Mumcord/mumcord/blob/main/CODE_SIGNING.md)). SmartScreen may still warn while the certificate builds up reputation: choose **More info → Run anyway**."
          else
            callout=WARNING
            windows_note="Windows is **not signed** yet. On first start, SmartScreen shows \"Windows protected your PC\": choose **More info → Run anyway**."
          fi
          if [[ -f MACOS-SIGNED ]]; then
            macos_note="macOS: the app is signed and notarized by Apple and opens normally. Microphone and keychain access are asked once and remembered across updates."
          else
            callout=WARNING
            macos_note="macOS is **not notarized** yet. Gatekeeper says Apple could not verify the app: open **System Settings → Privacy & Security** and choose **Open Anyway**. After each update macOS asks once more for microphone and keychain access; choose **Always Allow** for the keychain."
          fi
          cat > ../notes.md <<EOF
          ## Downloads

          - **Windows**: \`*-setup.exe\` (installer)
          - **macOS** (Apple Silicon and Intel): \`*.dmg\`
          - **Linux** (\`amd64\`/\`x86_64\` for Intel and AMD, \`arm64\`/\`aarch64\` for ARM):
            - Debian, Ubuntu and derivatives: \`*.deb\` (\`sudo apt install ./Mumcord_*.deb\`)
            - Fedora, openSUSE and derivatives: \`*.rpm\` (\`sudo dnf install ./Mumcord-*.rpm\` or \`sudo zypper install ./Mumcord-*.rpm\`)
            - Any distribution: \`*.AppImage\` (make it executable, then run it)

          Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. Each package type has a software bill of materials (SBOM, CycloneDX JSON) that lists its Rust crates, npm packages and bundled native libraries: \`mumcord-$VERSION-<platform>.cdx.json\`. The files are attested by GitHub (\`gh attestation verify <file> --repo Mumcord/mumcord\`).

          > [!$callout]
          > $windows_note
          >
          > $macos_note

          Built and smoke-tested by [this workflow run]($RUN_URL). [Code signing policy](https://github.com/Mumcord/mumcord/blob/main/CODE_SIGNING.md) · [Privacy policy](https://github.com/Mumcord/mumcord/blob/main/PRIVACY.md)

          These binaries are licensed under the [GNU AGPL-3.0](https://github.com/Mumcord/mumcord/blob/main/LICENSE) only.

          Full changelog: [CHANGELOG.md](https://github.com/Mumcord/mumcord/blob/main/CHANGELOG.md)
          EOF
          # Highlights are written per release; other versions get the plain notes.
          if [[ "$VERSION" == "0.3.0" ]]; then
            cat >> ../notes.md <<'EOF'

          ## What's new in 0.3.0

          - **In-game overlay on Linux**: see who is talking inside your game (Vulkan layer, works with Steam and Proton). Switch it on per game; games with anti-cheat are off by default.
          - **Window overlay**: a click-through window that shows who is talking in your own channel (with a helper for KDE).
          - **Now gaming**: share the game you are playing.
          - **Quick settings** with a collapsible Beta group, and **settings search** plus accessibility switches.
          - **Person menu** with switches, icons and Join channel; a **redesigned full profile** with a private note.
          - **Friends** with online state, and private chats that are kept.
          - **History sync** between Mumcord users, and **full-size images on demand**. Drop image files into the chat.
          - **Positional audio** with Mumble Link and the official game plugins.
          - **All 24 official EU languages.** The translations have not been reviewed by native speakers yet; corrections are welcome via the "Report a bug" issue template.
          - A privacy step in the setup wizard, plus changelog and support links in About.

          **Beta:** positional audio, game plugins and full-size images.
          **Coming later:** the in-game overlay on Windows (until then Windows uses the window overlay). There is no overlay on macOS.
          EOF
          elif [[ "$VERSION" == "0.4.0" ]]; then
            cat >> ../notes.md <<'EOF'

          ## What's new in 0.4.0

          - **Several servers at once**: stay connected to up to 5 servers (configurable up to 15), voice on one, chat, notifications and badges on all of them.
          - **Themes**: presets and your own colour themes, each with a dark and a light version, shareable as a code with a preview card in the chat, and optionally per server. Plus the website look with glow, gradients, glass and film grain.
          - **Chat**: replies, quotes, instant sending with Retry, a sticky author banner, a link menu, dismissable welcome messages and a rich-text comment editor.
          - **Watch party (Beta)**: watch YouTube together with the Mumcord users in your voice channel, with a shared playlist, in a floating widget.
          - **Screen sharing (Beta)**: share a window or screen with up to 8 Mumcord users in your channel at up to 720p30. Needs a direct connection, so it does not work for every pair of home networks (for example behind carrier-grade NAT). Sound is sent only on Windows 10 2004+ and macOS 13+, and only the shared app's sound; Linux shares the picture only, and X11 only the whole screen.
          - **Channel passwords**, a password prompt when a server rejects yours, and **connection info** (ping, loss, bandwidth) with a weak-connection icon.
          - **In-game overlay on Windows** as a click-through window over borderless games (no injection, safe with anti-cheat), HDR10 colours, Flatpak Steam, and an OpenGL launch option on Linux.
          - **Linux packages**: `.deb`, `.rpm`, AUR `mumcord-bin` and AppImage for x86_64 and ARM64, a one-line installer, app-menu entry, `mumble://` links and start at login. An optional update hint on all platforms.

          **Beta:** watch party, screen sharing, positional audio, game plugins and full-size images.
          **Removed:** the window overlay. Windows uses the new in-game overlay instead; people who had the window overlay on see a one-time notice.
          **Linux AppImage:** plays YouTube via VP9 but bundles no H.264; install your distribution's gst-libav for H.264 (see the README).
          EOF
          elif [[ "$VERSION" == "0.4.1" ]]; then
            cat >> ../notes.md <<'EOF'

          ## What's new in 0.4.1

          - **macOS connection fix**: Mumcord now asks for the Local Network permission, so connections to servers in your home network work on macOS 15 and later. Failures show a clear reason in the app and the log.
          - **macOS prompts**: far fewer keychain prompts, and the microphone prompt appears only once.
          - **macOS builds** are signed and notarized when signing is configured.
          - **Two servers failing at once** no longer collide on the password and certificate prompts.
          - The diagnostics page lists audio devices again.
          EOF
          elif [[ "$VERSION" == "0.4.2" ]]; then
            cat >> ../notes.md <<'EOF'

          ## What's new in 0.4.2

          - **macOS keychain**: Mumcord asks for keychain access only once, instead of repeating the prompt.
          - **Screen share and watch party**: people who join a channel now reliably see a running screen share or watch party.
          - **Linux AppImage**: YouTube videos in the watch party play again.
          EOF
          elif [[ "$VERSION" == "0.4.3" ]]; then
            cat >> ../notes.md <<'EOF'

          ## What's new in 0.4.3

          - **New Linux installer**: a cleaner look, and it offers to install gst-libav (H.264 video) when it is missing.
          - **Pasting images**: images from the clipboard (for example from Spectacle) and image files copied in the file manager can be pasted into the message box.
          - **No lost messages**: the last message you send before disconnecting or quitting is no longer lost.
          - **Connection banner**: the "couldn't connect" banner hides itself after a minute and can be dismissed.
          - **Libraries**: the protocol, codec, audio, store and p2p libraries are published on crates.io.

          ### Beta notes

          - **Message cards** are new: bots and people can post compact cards with a title, status colour, icon, text, image and link. Official Mumble clients show them as readable text.
          - The **packet inspector** is a hidden developer tool (seven clicks on the version in Settings, About). It opens in its own window and only reads what Mumcord sends and receives.
          EOF
          fi

      # Signed provenance: proves each file listed in SHA256SUMS was built by this workflow run.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
        # --generate-notes appends GitHub's change list after notes.md.
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Mumcord $VERSION" --notes-file notes.md --generate-notes \
            dist/*.AppImage dist/*.deb dist/*.rpm dist/*-setup.exe dist/*.dmg dist/*.cdx.json dist/install.sh dist/SHA256SUMS

  # After the draft exists, so a failed build never leaves a crate on crates.io without a
  # release (published versions cannot be removed). Pre-releases are skipped inside the workflow.
  publish-crates:
    name: Publish crates
    needs: [guard, release]
    uses: ./.github/workflows/publish-crates.yml
    with:
      version: ${{ needs.guard.outputs.version }}
    secrets: inherit
