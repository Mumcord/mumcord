name: Release

# Release builds from version tags on main (decision QA.12). Pushing `vX.Y.Z` checks that the
# tag is a version and points to a commit on main (a release candidate `vX.Y.Z-rc.N`: a commit on
# milestone/X.Y.Z, released as a pre-release that never becomes "Latest"), sets that version in all manifests of each
# build (scripts/set-version.sh), builds and smoke-tests the bundles (build-and-smoke.yml), and
# creates a DRAFT GitHub Release with the bundles, one SBOM per bundle type, SHA256SUMS and the
# signed build provenance (mumcord-X.Y.Z.intoto.jsonl). The maintainer reviews and publishes it by hand. See RELEASING.md.
on:
  push:
    tags: ["v*"]

# Never build the same tag twice at once; never cancel a running release build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Check tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0

      # The manifests in the repository are not bumped for a release: every job that builds or
      # publishes sets this version first (scripts/set-version.sh, RELEASING.md).
      # vX.Y.Z on main is a release; vX.Y.Z-rc.N on milestone/X.Y.Z (not yet on main) is a
      # release candidate, published as a pre-release. Every other tag fails here.
      - name: Check tag is a release on main or a release candidate on its milestone branch
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! result=$(scripts/release-tag.sh "$TAG" 2>&1); then
            echo "::error::$result"
            exit 1
          fi
          echo "$result" | tee -a "$GITHUB_OUTPUT"

      # Fails here, before any build, when the script cannot set this version.
      - name: Dry run of the version step
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

  # Regenerates the third-party notices from the tagged commit, so the About page of every bundle
  # lists exactly the dependencies it ships; the build jobs bundle this artifact. It also enforces
  # the licence policy (scripts/generate-notices.sh) before anything is built.
  notices:
    name: Generate third-party notices
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read tool versions
        id: tools
        run: grep '^[A-Z_]*=' scripts/license-tools.env >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          # The FreeBSD package's SBOM is resolved from this Linux runner (spec 13 §10).
          targets: x86_64-unknown-freebsd

      - uses: ./.github/actions/cargo-tool
        with:
          crate: cargo-about
          version: ${{ steps.tools.outputs.CARGO_ABOUT_VERSION }}
          features: cli

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate notices
        run: scripts/generate-notices.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: |
            THIRD_PARTY_NOTICES
            ui/public/third-party-notices.txt
            ui/public/third-party-notices.json
          if-no-files-found: error

  build:
    needs: [guard, notices]
    uses: ./.github/workflows/build-and-smoke.yml
    with:
      release: true
      version: ${{ needs.guard.outputs.version }}
    # Passes the optional Apple and Certum signing secrets (docs/release-signing.md).
    secrets: inherit
    permissions:
      contents: read

  # One CycloneDX SBOM per bundle type (scripts/generate-sbom.sh), from the tagged commit and the
  # native libraries each build job recorded (scripts/sbom-native.sh).
  sbom:
    name: Generate SBOMs
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read tool versions
        id: tools
        run: grep '^[A-Z_]*=' scripts/license-tools.env >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-tool
        with:
          crate: cargo-cyclonedx
          version: ${{ steps.tools.outputs.CARGO_CYCLONEDX_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-native-*
          path: native
          merge-multiple: true

      # The manifests carry no release version; set the tag's, as the builds do, so the SBOMs
      # list Mumcord's own crates and packages with it.
      - name: Set version
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - name: Generate SBOMs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/generate-sbom.sh "$VERSION" native sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mumcord-sbom
          path: sbom/
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [guard, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The updater signing key exists only in the "release" environment, which accepts only
    # version tags, so no other workflow run can read it.
    environment: release
    permissions:
      # Creates the draft release and uploads its files.
      contents: write
      # Build provenance attestation of the release files.
      id-token: write
      attestations: write
    steps:
      # The curl installer, which is published with each release (FR-2.54), and the changelog for the
      # release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/install.sh
            scripts/sign-updater-bundles.sh
            scripts/verify-updater-signature.js
            src-tauri/tauri.conf.json
            package.json
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mumcord-*-release
          path: dist
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mumcord-sbom
          path: dist

      # Updater signatures and the update manifest latest.json for the in-app updater (issue #168,
      # docs/release-signing.md). Fails the release when the signing secret or the public key in
      # the app is missing, or when the key does not match the app's public key.
      - name: Sign updater bundles
        working-directory: dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Set only for the one release of a key rotation (docs/release-signing.md).
          UPDATER_ROTATION_OLD_PUBKEY: ${{ vars.UPDATER_ROTATION_OLD_PUBKEY }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: ../scripts/sign-updater-bundles.sh "$VERSION" ..

      - name: Write checksums and release notes
        working-directory: dist
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          # Fails if any bundle is missing; Linux has three packages for each of two CPUs, macOS a
          # DMG and an updater archive for each of two CPUs.
          linux=(*_amd64.AppImage *_aarch64.AppImage *_amd64.deb *_arm64.deb *.x86_64.rpm *.aarch64.rpm)
          macos=(*_aarch64.dmg *_x64.dmg *_aarch64.app.tar.gz *_x64.app.tar.gz)
          # FreeBSD 15.x amd64 (spec 13); the package carries its own third-party notices.
          freebsd=(*.pkg)
          ls -l -- "${linux[@]}" "${freebsd[@]}" *-setup.exe *-portable.zip "${macos[@]}" *.cdx.json *.sig latest.json
          cp ../scripts/install.sh .
          sha256sum -- "${linux[@]}" "${freebsd[@]}" *-setup.exe *-portable.zip "${macos[@]}" *.cdx.json *.sig latest.json install.sh > SHA256SUMS
          cat SHA256SUMS
          # A warning box as soon as one platform is unsigned, a plain note otherwise.
          callout=NOTE
          if [[ -f WINDOWS-SIGNED ]]; then
            windows_note="Windows: the app (also in the portable zip) and installer are signed (see the [code signing policy](https://github.com/Mumcord/mumcord/blob/main/CODE_SIGNING.md)). SmartScreen may still warn while the certificate builds up reputation: choose **More info → Run anyway**."
          else
            callout=WARNING
            windows_note="Windows is **not signed** yet. On first start, SmartScreen shows \"Windows protected your PC\": choose **More info → Run anyway**."
          fi
          if [[ -f MACOS-SIGNED ]]; then
            macos_note="macOS: the app is signed and notarized by Apple and opens normally. Microphone and keychain access are asked once and remembered across updates."
          else
            callout=WARNING
            macos_note="macOS is **not notarized** yet. Gatekeeper says Apple could not verify the app: open **System Settings → Privacy & Security** and choose **Open Anyway**. After each update macOS asks once more for microphone and keychain access; choose **Always Allow** for the keychain."
          fi
          cat > ../notes.md <<EOF
          ## Downloads

          - **Windows**: \`*-setup.exe\` (installer) or \`*-portable.zip\` (portable: unpack and run \`Mumcord.exe\`, no installation; data stays in \`MumcordData\` next to it; needs the WebView2 Runtime, see \`README-portable.txt\`)
          - **macOS (Apple Silicon)** (M1 and newer): \`*_aarch64.dmg\`
          - **macOS (Intel)**: \`*_x64.dmg\`
          - **Linux** (\`amd64\`/\`x86_64\` for Intel and AMD, \`arm64\`/\`aarch64\` for ARM):
            - Debian, Ubuntu and derivatives: \`*.deb\` (\`sudo apt install ./Mumcord_*.deb\`)
            - Fedora, openSUSE and derivatives: \`*.rpm\` (\`sudo dnf install ./Mumcord-*.rpm\` or \`sudo zypper install ./Mumcord-*.rpm\`)
            - Any distribution: \`*.AppImage\` (make it executable, then run it)
          - **FreeBSD 15.x (amd64)**: \`mumcord-$VERSION.pkg\` (\`sudo pkg add ./mumcord-$VERSION.pkg\`). Updates come with \`pkg upgrade\`, the app never updates itself. Not available there: camera and AI backgrounds, in-game overlay, screen-share sound, window picker, protected (DRM) video. Screen sharing captures the whole X11 screen. Intel graphics need \`drm-66-kmod\`, and real-time audio needs the \`realtime\` group (\`pkg info -D mumcord\`).

          Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. Each package type has a software bill of materials (SBOM, CycloneDX JSON) that lists its Rust crates, npm packages and bundled native libraries: \`mumcord-$VERSION-<platform>.cdx.json\` (\`windows-x86_64\` covers the installer and the portable zip, which carry the same \`Mumcord.exe\`). The files are attested by GitHub (\`gh attestation verify <file> --repo Mumcord/mumcord\`); the signed attestation is also attached as \`mumcord-$VERSION.intoto.jsonl\` for offline checks (\`gh attestation verify <file> --repo Mumcord/mumcord --bundle mumcord-$VERSION.intoto.jsonl\`).

          > [!$callout]
          > $windows_note
          >
          > $macos_note

          Built and smoke-tested by [this workflow run]($RUN_URL). [Code signing policy](https://github.com/Mumcord/mumcord/blob/main/CODE_SIGNING.md) · [Privacy policy](https://github.com/Mumcord/mumcord/blob/main/PRIVACY.md)

          These binaries are licensed under the [GNU AGPL-3.0](https://github.com/Mumcord/mumcord/blob/main/LICENSE) only.

          Full changelog: [CHANGELOG.md](https://github.com/Mumcord/mumcord/blob/main/CHANGELOG.md)
          EOF
          if [[ "$PRERELEASE" == "true" ]]; then
            { printf '> [!IMPORTANT]\n> This is a **release candidate** of Mumcord %s for testing. The in-app updater, Homebrew and the AUR keep offering the latest final release; installing the final %s later replaces this one.\n\n' \
                "${VERSION%%-*}" "${VERSION%%-*}"; cat ../notes.md; } > ../notes.tmp
            mv ../notes.tmp ../notes.md
          fi
          # "What's new" is the version's section of CHANGELOG.md (dated, "X.Y.Z - Unreleased" or a plain
          # "[Unreleased]" at tag time); without one the notes stay plain.
          section() {
            awk -v h="## [$1]" '
              /^## / { on = index($0, h) == 1; next }
              /^\[[0-9]/ { on = 0 }
              on' ../CHANGELOG.md
          }
          # A plain "## [Unreleased]" section is the release when the version has no section of its own.
          whats_new=$(section "$VERSION")
          [[ -n "${whats_new//[[:space:]]/}" ]] || whats_new=$(section Unreleased)
          if [[ -n "${whats_new//[[:space:]]/}" ]]; then
            { printf '\n## What'"'"'s new in %s\n' "$VERSION"; printf '%s\n' "$whats_new"; } >> ../notes.md
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; the release notes have no \"What's new\"."
          fi

      # Signed provenance: proves each file listed in SHA256SUMS was built by this workflow run.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # The same signed attestation (a Sigstore bundle as one JSON line) as a release asset, so it
      # can be checked offline and OpenSSF Scorecard finds provenance (it looks for *.intoto.jsonl).
      # It is not listed in SHA256SUMS: it is made from that list, and its own signature protects it.
      - name: Attach provenance file
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          test -s "$BUNDLE"
          cp -- "$BUNDLE" "dist/mumcord-$VERSION.intoto.jsonl"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        # --generate-notes appends GitHub's change list after notes.md. A release candidate is a
        # pre-release that never becomes "Latest": the Homebrew tap and the curl installer follow
        # "Latest", and the in-app updater skips pre-releases unless it runs one itself.
        run: |
          kind=()
          title="Mumcord $VERSION"
          if [[ "$PRERELEASE" == "true" ]]; then
            kind=(--prerelease --latest=false)
            title="Mumcord ${VERSION%%-rc.*} RC ${VERSION##*-rc.}"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${kind[@]}" \
            --title "$title" --notes-file notes.md --generate-notes \
            dist/*.AppImage dist/*.deb dist/*.rpm dist/*.pkg dist/*-setup.exe dist/*-portable.zip dist/*.dmg dist/*.app.tar.gz dist/*.sig dist/latest.json dist/*.cdx.json dist/install.sh dist/SHA256SUMS dist/*.intoto.jsonl

  # After the draft exists, so a failed build never leaves a crate on crates.io without a
  # release (published versions cannot be removed). Pre-releases are skipped inside the workflow.
  publish-crates:
    name: Publish crates
    needs: [guard, release]
    uses: ./.github/workflows/publish-crates.yml
    with:
      version: ${{ needs.guard.outputs.version }}
    secrets: inherit
