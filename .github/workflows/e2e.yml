name: E2E

# UI end-to-end tests in the e2e/ Docker image (WebKitWebDriver + tauri-driver, Xvfb) against
# the local testenv Mumble servers. Slow, so separate from CI: on pull requests to main and manual
# runs. One job builds the image and the debug binaries once, five shard jobs run the spec files
# of e2e/shards.json in parallel (each runner has its own test servers), and "Linux E2E" (the
# check main's branch protection requires) passes only when all of them passed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MUMCORD_E2E_CACHE: /home/runner/.cache/mumcord-e2e

jobs:
  # Decides whether the heavy jobs run. A path filter on the trigger would leave the required
  # checks pending forever on documentation-only pull requests, so the checks always report.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - id: filter
        run: scripts/ci/code-changed.sh >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  build:
    name: E2E build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # A cache entry is never re-saved under the same key, so the week in the key makes the
      # target dir follow the code (one save per week) instead of drifting further from it.
      # The month scopes the image layer cache (apt, rustup, tauri-driver): rebuilt only when
      # e2e/Dockerfile changes, and once a month so the toolchain and packages do not go stale.
      - name: Cache keys
        id: keys
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Cargo registry + target dir of the in-container build.
      - uses: actions/cache@v4
        with:
          path: ${{ env.MUMCORD_E2E_CACHE }}
          key: e2e-${{ hashFiles('Cargo.lock', 'e2e/Dockerfile') }}-${{ steps.keys.outputs.week }}
          restore-keys: e2e-

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: e2e
          tags: mumcord-e2e
          load: true
          cache-from: type=gha,scope=e2e-image-${{ steps.keys.outputs.month }}
          cache-to: type=gha,mode=max,scope=e2e-image-${{ steps.keys.outputs.month }}

      # No debug info and no incremental data: faster links and a smaller target cache.
      - name: Build image and binaries
        run: npm run e2e
        env:
          MUMCORD_E2E_STEP: build
          MUMCORD_E2E_IMAGE_BUILT: 1
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_INCREMENTAL: 0

      # zstd instead of the artifact zip: much faster for the ~3 GB image. tar keeps the
      # executable bits that artifacts would drop.
      - name: Package image and binaries
        run: |
          docker save mumcord-e2e | zstd -T0 -3 -q -o e2e-image.tar.zst
          tar -C "$MUMCORD_E2E_CACHE/target/debug" -cf - mumcord mumcord-bot netsim examples/libtest_plugin.so \
            examples/headless_check libmumcord_overlay_layer.so \
            | zstd -T0 -3 -q -o e2e-bin.tar.zst
          ls -lh e2e-image.tar.zst e2e-bin.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: |
            e2e-image.tar.zst
            e2e-bin.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  shard:
    name: E2E shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Must match the number of shards in e2e/shards.json.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: e2e-build

      - name: Load image and binaries
        run: |
          zstd -dc e2e-image.tar.zst | docker load -q
          mkdir -p "$MUMCORD_E2E_CACHE/target/debug"
          zstd -dc e2e-bin.tar.zst | tar -C "$MUMCORD_E2E_CACHE/target/debug" -xf -
          rm e2e-image.tar.zst e2e-bin.tar.zst

      # run.sh creates testenv/.env with a random SuperUser password; no secrets needed.
      - name: Run E2E shard
        run: npm run e2e
        env:
          MUMCORD_E2E_STEP: test
          MUMCORD_E2E_SHARD: ${{ matrix.shard }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-shard-${{ matrix.shard }}
          path: e2e/artifacts/
          if-no-files-found: ignore

  # Required status check. always(): a skipped check counts as passed for branch protection, so
  # this job must run and fail when the build failed and the shards were skipped.
  e2e:
    name: Linux E2E
    needs: [changes, build, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check build and shard results
        run: |
          echo "changes: $CHANGES, build: $BUILD, shards: $SHARDS"
          [ "$CHANGES" = success ] || exit 1
          # Documentation-only change: build and shards are skipped on purpose.
          if [ "$BUILD" = skipped ] && [ "$SHARDS" = skipped ]; then exit 0; fi
          [ "$BUILD" = success ] && [ "$SHARDS" = success ]
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.shard.result }}
