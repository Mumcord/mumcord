# A push to a pull request takes back the approvals given on its earlier commits, whoever gave
# them (a person or the Claude review), so that an approval always speaks for the code that is
# there now. GitHub's own "dismiss stale approvals" switch only works on protected branches;
# this covers every base branch, milestone branches included.
#
# `pull_request_target` runs this file from the base branch with a token that may dismiss
# reviews, also for pull requests from forks. That is safe here because the job never checks
# out or runs code from the pull request; it only calls the GitHub API.
name: Dismiss stale approvals

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read

jobs:
  dismiss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # An approval given on the commit that is the head right now stays: the review of this
      # very push may already have finished when this job starts late.
      - name: Dismiss approvals of earlier commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq ".[] | select(.state == \"APPROVED\" and .commit_id != \"$HEAD_SHA\") | .id" |
          while read -r id; do
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="New commits were pushed after this approval." -f event=DISMISS > /dev/null
            echo "dismissed review $id"
          done
