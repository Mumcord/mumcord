name: Publish crates

# Publishes the library crate mumcord-protocol to crates.io so other projects (for example the
# bot) can depend on it by version. Called by release.yml after the draft release exists, and
# runnable by hand from main to publish the current version without a new release. A version
# that is already on crates.io is skipped, pre-release versions are never published. See
# RELEASING.md.
on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

# crates.io versions are immutable; never publish the same one twice at once.
concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish-protocol:
    name: Publish mumcord-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only publish from main or a version tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mumcord-protocol") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "::notice::mumcord-protocol $version is a pre-release; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io rejects API requests without a User-Agent.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "mumcord-ci (https://github.com/Mumcord/mumcord)" \
            "https://crates.io/api/v1/crates/mumcord-protocol/$version")
          case "$status" in
            200)
              echo "::notice::mumcord-protocol $version is already on crates.io; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered HTTP $status; cannot tell whether $version exists."
              exit 1 ;;
          esac

      - name: Publish to crates.io
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mumcord-protocol --locked
