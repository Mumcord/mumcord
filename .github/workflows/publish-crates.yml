name: Publish crates

# Publishes the library crates mumcord-protocol, mumcord-codec, mumcord-store, mumcord-audio and mumcord-p2p to crates.io so other projects
# (for example the bot) can depend on them by version. Called by release.yml after the draft
# release exists, with the tag's version. Runnable by hand from a version tag (or main) to publish
# a release's crates without a new release. Each job first sets the version in the manifests,
# which the repository does not carry (scripts/set-version.sh). A version that is already on
# crates.io is skipped per crate, pre-release versions are never published. See RELEASING.md.
on:
  workflow_call:
    inputs:
      version:
        description: Version to publish (X.Y.Z); release.yml passes the tag's version.
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (X.Y.Z). Empty: the version of the tag this runs from, or else the
          latest release tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read

# crates.io versions are immutable; never publish the same one twice at once.
concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish-protocol:
    name: Publish mumcord-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only publish from main or a version tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" && "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/set-version.sh "${VERSION:-$(scripts/latest-release-version.sh)}"

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mumcord-protocol") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "::notice::mumcord-protocol $version is a pre-release; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io rejects API requests without a User-Agent.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "mumcord-ci (https://github.com/Mumcord/mumcord)" \
            "https://crates.io/api/v1/crates/mumcord-protocol/$version")
          case "$status" in
            200)
              echo "::notice::mumcord-protocol $version is already on crates.io; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered HTTP $status; cannot tell whether $version exists."
              exit 1 ;;
          esac

      - name: Publish to crates.io
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the version step changed the manifests in the checkout.
        run: cargo publish -p mumcord-protocol --locked --allow-dirty

  publish-codec:
    name: Publish mumcord-codec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only publish from main or a version tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" && "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/set-version.sh "${VERSION:-$(scripts/latest-release-version.sh)}"

      # cargo verifies the packaged crate by building it; the Opus sources need cmake.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mumcord-codec") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "::notice::mumcord-codec $version is a pre-release; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io rejects API requests without a User-Agent.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "mumcord-ci (https://github.com/Mumcord/mumcord)" \
            "https://crates.io/api/v1/crates/mumcord-codec/$version")
          case "$status" in
            200)
              echo "::notice::mumcord-codec $version is already on crates.io; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered HTTP $status; cannot tell whether $version exists."
              exit 1 ;;
          esac

      - name: Publish to crates.io
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the version step changed the manifests in the checkout.
        run: cargo publish -p mumcord-codec --locked --allow-dirty

  publish-audio:
    name: Publish mumcord-audio
    # mumcord-audio depends on mumcord-codec, which must be on crates.io first.
    needs: publish-codec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only publish from main or a version tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" && "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/set-version.sh "${VERSION:-$(scripts/latest-release-version.sh)}"

      # cpal links ALSA and PipeWire (its bindings are generated with libclang), real-time
      # scheduling talks to rtkit over D-Bus (libdbus-sys), and cargo verifies the packaged crate
      # by building it. apt-install.sh falls back to other mirrors.
      - name: Install build dependencies
        timeout-minutes: 20
        run: |
          scripts/ci/apt-install.sh libasound2-dev libpipewire-0.3-dev libclang-dev \
            libdbus-1-dev pkg-config cmake

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mumcord-audio") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "::notice::mumcord-audio $version is a pre-release; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io rejects API requests without a User-Agent.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "mumcord-ci (https://github.com/Mumcord/mumcord)" \
            "https://crates.io/api/v1/crates/mumcord-audio/$version")
          case "$status" in
            200)
              echo "::notice::mumcord-audio $version is already on crates.io; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered HTTP $status; cannot tell whether $version exists."
              exit 1 ;;
          esac

      - name: Publish to crates.io
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the version step changed the manifests in the checkout.
        run: cargo publish -p mumcord-audio --locked --allow-dirty

  publish-store:
    name: Publish mumcord-store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only publish from main or a version tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" && "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/set-version.sh "${VERSION:-$(scripts/latest-release-version.sh)}"

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mumcord-store") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "::notice::mumcord-store $version is a pre-release; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io rejects API requests without a User-Agent.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "mumcord-ci (https://github.com/Mumcord/mumcord)" \
            "https://crates.io/api/v1/crates/mumcord-store/$version")
          case "$status" in
            200)
              echo "::notice::mumcord-store $version is already on crates.io; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered HTTP $status; cannot tell whether $version exists."
              exit 1 ;;
          esac

      - name: Publish to crates.io
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the version step changed the manifests in the checkout.
        run: cargo publish -p mumcord-store --locked --allow-dirty

  publish-p2p:
    name: Publish mumcord-p2p
    # mumcord-p2p depends on mumcord-protocol, which must be on crates.io first.
    needs: publish-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only publish from main or a version tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" && "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/set-version.sh "${VERSION:-$(scripts/latest-release-version.sh)}"

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mumcord-p2p") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "::notice::mumcord-p2p $version is a pre-release; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io rejects API requests without a User-Agent.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "mumcord-ci (https://github.com/Mumcord/mumcord)" \
            "https://crates.io/api/v1/crates/mumcord-p2p/$version")
          case "$status" in
            200)
              echo "::notice::mumcord-p2p $version is already on crates.io; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered HTTP $status; cannot tell whether $version exists."
              exit 1 ;;
          esac

      - name: Publish to crates.io
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the version step changed the manifests in the checkout.
        run: cargo publish -p mumcord-p2p --locked --allow-dirty
