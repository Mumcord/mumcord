# One ALSA PCM per OSS unit, so Mumcord can list and pick each sound card (FR-13.15).
#
# FreeBSD's ALSA is a compatibility layer over OSS: alsa-lib knows no cards, only the `oss`
# plugin, which always opens /dev/dsp. These entries give every unit a name of its own; Mumcord
# hides the ones whose device file does not exist. Installed as
# /usr/local/etc/alsa/conf.d/95-mumcord-oss.conf, so other ALSA applications see them too —
# harmless, they are ordinary PCM names.

pcm.mumcord_dsp0 {
    type oss
    device "/dev/dsp0"
    hint { show on; description "Sound card 0 (OSS)" }
}

pcm.mumcord_dsp1 {
    type oss
    device "/dev/dsp1"
    hint { show on; description "Sound card 1 (OSS)" }
}

pcm.mumcord_dsp2 {
    type oss
    device "/dev/dsp2"
    hint { show on; description "Sound card 2 (OSS)" }
}

pcm.mumcord_dsp3 {
    type oss
    device "/dev/dsp3"
    hint { show on; description "Sound card 3 (OSS)" }
}

pcm.mumcord_dsp4 {
    type oss
    device "/dev/dsp4"
    hint { show on; description "Sound card 4 (OSS)" }
}

pcm.mumcord_dsp5 {
    type oss
    device "/dev/dsp5"
    hint { show on; description "Sound card 5 (OSS)" }
}

pcm.mumcord_dsp6 {
    type oss
    device "/dev/dsp6"
    hint { show on; description "Sound card 6 (OSS)" }
}

pcm.mumcord_dsp7 {
    type oss
    device "/dev/dsp7"
    hint { show on; description "Sound card 7 (OSS)" }
}
