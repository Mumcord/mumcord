[package]
name = "fx-highlight"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
# Same code as the strip plugin; only the manifest differs.
path = "../strip/src/lib.rs"

[dependencies]
mumcord-plugin-sdk = { path = "../../../../crates/plugin-sdk" }

[profile.release]
opt-level = "s"
codegen-units = 1

# A plugin is its own workspace, also inside the Mumcord tree.
[workspace]
