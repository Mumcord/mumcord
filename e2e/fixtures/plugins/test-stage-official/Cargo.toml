[package]
name = "test-stage-official"
version = "1.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "../test-stage/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
mumcord-plugin-sdk = { path = "../../../../crates/plugin-sdk", features = ["1.1"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
codegen-units = 1

# A plugin is its own workspace, also inside the Mumcord tree.
[workspace]
