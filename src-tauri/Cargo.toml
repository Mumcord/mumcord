[package]
name = "mumcord"
description = "Mumcord desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "mumcord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Env-selected null/WAV-file audio backend for E2E runs (e2e/); never in release builds.
test-backend = ["mumcord-engine/test-backend"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mumcord-engine.workspace = true
mumcord-overlay-ipc = { workspace = true, features = ["render"] }
mumcord-protocol.workspace = true
mumcord-plugins.workspace = true
semver.workspace = true
base64 = "0.23"
# Not inherited from the workspace: the Tauri CLI ignores the features of inherited dependencies
# and only bundles the tray library (libayatana-appindicator3) into the AppImage when it sees
# `tray-icon` here. `macos-private-api`: a transparent webview background for the overlay
# window (FR-1.44) on macOS.
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-deep-link.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-clipboard-manager.workspace = true
image.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rand.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-global-shortcut.workspace = true
# In-app updater (#168): download, minisign signature check, install and relaunch.
tauri-plugin-updater.workspace = true
minisign-verify = "0.3"
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, features = ["global_shortcuts"] }
# Activation token for the shortcut settings the portal opens (KDE Wayland focus rules).
gdk.workspace = true
# Message notifications (FR-1.48c): D-Bus notification service, window activation token.
zbus.workspace = true
futures-util.workspace = true
# Opens links through the desktop launchers (see browser.rs).
open.workspace = true
gtk.workspace = true
# Mouse-button push-to-talk: evdev reads on Wayland, XInput2 raw button events on X11.
libc.workspace = true
x11rb = { workspace = true, features = ["xinput"] }
# Tray icon as a StatusNotifierItem (FR-2.52): Tauri's Linux tray cannot show a tooltip.
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Opens links in the default browser (see browser.rs; Linux uses the launchers directly).
tauri-plugin-opener.workspace = true
# Message notifications (FR-1.48c).
notify-rust.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Mouse-button push-to-talk: low-level mouse hook. Registry: the autostart `Run` entry.
# Gdi, Accessibility (WinEvent hooks) and Shell (fullscreen state): the in-game overlay window.
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# "Now playing" (FR-1.58): the system media session. Same version as Tauri's own `windows`.
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Mouse-button push-to-talk: listen-only event tap and the Accessibility check.
core-graphics.workspace = true
core-foundation.workspace = true

[dev-dependencies]
# `tauri::test` mock app for the X11 push-to-talk check.
tauri = { version = "2.12", features = ["test"] }
tempfile.workspace = true
# Signs throwaway update bundles in the updater tests (issue #168); never used to ship.
minisign = "0.10"

[lints]
workspace = true
