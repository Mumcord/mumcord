# Scenario for the plugin that `mumcord-plugin new` creates (and the SDK example `hello`).
# Run it with:  mumcord-plugin test dist/<id>-0.1.0.mcplugin scenarios/hello.yaml
#
# A scenario starts the plugin in a mock host, sends the events of `steps` in order and checks
# that the expected output follows. Each `expect` waits up to 1 s for a matching output after
# the previous match. Texts match as substrings, message payloads exactly.
name: Waving counts, stores and tells the channel

# Optional: the granted permissions (default: required + suggested optional ones).
grant: [ui.panel, peers.messages]
# You (default: session 1, "Me") and the other users in the channel who run this plugin.
me: { session: 1, name: Alice }
peers:
  - { session: 2, name: Bob }

steps:
  - expect: { tree: { slot: panel, text: "Waves: 0" } }

  # A click on the "Wave" button.
  - event: { ui-action: { action: wave } }
  - expect: { message: { to: channel, kind: 1, text: "null" } }
  - expect: { tree: { slot: panel, text: "Waves: 1" } }

  - event: { ui-action: { action: wave } }
  - expect: { tree: { slot: panel, text: "Waves: 2" } }

  # Bob waves back.
  - event: { peer-message: { from: 2, kind: 1, text: "null" } }
  - expect: { log: { contains: someone waved } }

  # Unknown actions change nothing.
  - event: { ui-action: { action: dance } }
  - expect: nothing
