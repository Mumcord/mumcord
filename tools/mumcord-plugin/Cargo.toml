[package]
name = "mumcord-plugin"
description = "Command-line tool for Mumcord plugin authors and repository maintainers"
homepage = "https://github.com/Mumcord/mumcord"
documentation = "https://docs.rs/mumcord-plugin"
readme = "README.md"
keywords = ["mumcord", "mumble", "plugin", "wasm", "cli"]
categories = ["command-line-utilities", "development-tools", "wasm"]
include = ["src/**", "scenarios/**", "README.md"]
version.workspace = true
edition.workspace = true
# Runs plugins in the same runtime as the client, which needs Rust 1.97 (wasmtime 50).
rust-version = "1.97"
license = "Apache-2.0"
repository.workspace = true

[dependencies]
mumcord-plugins.workspace = true
mumcord-store.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
toml.workspace = true
minisign.workspace = true
sha2.workspace = true
zip.workspace = true
semver.workspace = true
wit-component.workspace = true
wit-parser.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
wat.workspace = true

[lints]
workspace = true
