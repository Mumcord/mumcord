[package]
name = "mumcord-plugin"
description = "Command-line tool for Mumcord plugin authors and repository maintainers"
version.workspace = true
edition.workspace = true
# Runs plugins in the same runtime as the client, which needs Rust 1.97 (wasmtime 50).
rust-version = "1.97"
license = "Apache-2.0"
repository.workspace = true
publish = false

[dependencies]
mumcord-plugins.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
toml.workspace = true
minisign.workspace = true
sha2.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
